/* STRATEGIAN — the papers that land on your desk each morning.
   Accuracy scales with your intelligence service; a weak service reports
   confidently and wrongly, which is worse than reporting nothing.       */
(function (S) {
  'use strict';

  const B = S.Brief = {};

  B.confidenceWord = function (acc) {
    if (acc > 0.85) return 'HIGH CONFIDENCE';
    if (acc > 0.65) return 'MODERATE CONFIDENCE';
    if (acc > 0.45) return 'LOW CONFIDENCE';
    return 'FRAGMENTARY — TREAT WITH CAUTION';
  };

  /* ------------------------------------------------- intelligence brief */
  B.intelligence = function (st) {
    const acc = st.intel.accuracy;
    const threats = S.Dip.assessThreats(st);
    const rng = st.rng;
    const sections = [];

    sections.push({
      h: 'Assessment of Principal Threats',
      body: threats.slice(0, 4).map((t) => {
        const n = S.dip(st, t.id);
        const verb = t.score > 70 ? 'assesses hostile intent as active' :
          t.score > 45 ? 'assesses hostile intent as probable' :
            t.score > 25 ? 'assesses limited hostile intent' : 'assesses no immediate hostile intent';
        return '<b>' + n.name + '</b> — ' + verb + '. Force ratio ' + S.round(t.ratio, 2) +
          ':1 in ' + (t.ratio > 1 ? 'our' : 'their') + ' favour' +
          (n.nuclear ? '; nuclear-armed' : '') + '. Posture: ' + n.stance + '.';
      })
    });

    // Foreign intentions — noisy, and sometimes flatly wrong.
    const intentions = [];
    st.diplomacy.nations.slice().sort((a, b) => b.power - a.power).slice(0, 5).forEach((n) => {
      const truth = n.relation < -40 ? 'preparing coercive options against us' :
        n.relation < -10 ? 'seeking to constrain our freedom of action' :
          n.relation > 50 ? 'seeking deeper alignment with us' :
            'pursuing its own regional priorities';
      const wrong = rng.chance(1 - acc);
      const reported = wrong ? rng.pick([
        'preparing coercive options against us', 'seeking deeper alignment with us',
        'internally paralysed and unable to act', 'pursuing its own regional priorities'
      ]) : truth;
      intentions.push('<b>' + n.name + '</b> is ' + reported + '.' +
        (wrong && acc < 0.5 ? ' <span class="c-mute">(single source, uncorroborated)</span>' : ''));
    });
    sections.push({ h: 'Foreign Intentions', body: intentions });

    // Internal picture.
    const internal = [];
    const rep = S.Soc.repression(st);
    internal.push('Domestic dissent index: <b>' + S.round(S.Dip.observed(st, st.society.unrest, 10), 0) +
      '</b>. Latent resentment assessed at <b>' + S.round(S.Dip.observed(st, st.society.latent, 12), 0) + '</b>.');
    if (st.society.latent > 55) internal.push('<span class="c-bad">Warning:</span> resentment is running well ahead of visible unrest. Control measures are suppressing symptoms, not causes.');
    if (rep > 65) internal.push('Informant networks report increasing self-censorship. Reporting quality from the interior is degrading as a result.');
    const worst = st.factions.slice().sort((a, b) => (a.loyalty - a.power * 0.3) - (b.loyalty - b.power * 0.3))[0];
    internal.push('Least reliable constituency: <b>' + (S.FACTIONS.find((f) => f.id === worst.id) || {}).name +
      '</b> (loyalty ' + S.round(S.Dip.observed(st, worst.loyalty, 8), 0) + ', influence ' + S.round(worst.power, 0) + ').');
    if (st.risk.coup > 30) internal.push('<span class="c-bad">Counter-intelligence flags unusual contact between senior officers and civilian figures outside the government.</span>');
    sections.push({ h: 'Internal Security', body: internal });

    // Collection capability.
    const cap = [];
    cap.push('Collection capability rated <b>' + S.round(st.intel.strength, 0) + '/100</b>; product reliability ' +
      B.confidenceWord(acc) + '.');
    if (st.intel.strength < 40) cap.push('We are effectively blind on ' +
      st.diplomacy.nations.filter((n) => n.power > 55).map((n) => n.name).slice(0, 2).join(' and ') + '.');
    const sharing = st.diplomacy.nations.filter((n) => n.treaties.indexOf('intel') >= 0);
    if (sharing.length) cap.push('Liaison product received from ' + sharing.map((n) => n.name).join(', ') + '.');
    sections.push({ h: 'Collection Posture', body: cap });

    return {
      title: 'DAILY INTELLIGENCE SUMMARY',
      classification: st.intel.strength > 60 ? 'TOP SECRET — LIMITED DISTRIBUTION' : 'SECRET',
      date: S.dateLong(st.date),
      confidence: B.confidenceWord(acc),
      sections: sections
    };
  };

  /* ----------------------------------------------------- military brief */
  B.military = function (st) {
    const m = st.military;
    const rank = S.Mil.worldRank(st);
    const myRank = rank.findIndex((x) => x.self) + 1;
    const sections = [];

    sections.push({
      h: 'Force Status',
      body: [
        'Establishment <b>' + S.headcount(m.manpower) + '</b> under arms. Readiness <b>' +
        S.round(m.readiness, 0) + '</b>, equipment <b>' + S.round(m.equipment, 0) + '</b>, technology <b>' +
        S.round(m.tech, 0) + '</b>, logistics <b>' + S.round(m.logistics, 0) + '</b>.',
        'Combat effectiveness index <b>' + S.round(m.quality, 0) + '/100</b>. Global power ranking: <b>' +
        S.ordinal(myRank) + '</b> of ' + rank.length + '.',
        'Doctrine: <b>' + S.Mil.DOCTRINES[st.policy.mil.doctrine].name + '</b>. Nuclear posture: <b>' +
        S.Mil.NUCLEAR_POSTURES[st.policy.mil.nuclearPosture].name + '</b>' +
        (m.nuclear > 1 ? ' (arsenal index ' + S.round(m.nuclear, 0) + ')' : '') + '.',
        m.readiness < 40 ? '<span class="c-bad">Readiness is below the level at which I can guarantee a response to a short-notice contingency.</span>' :
          m.readiness > 75 ? 'Readiness is sufficient for short-notice operations across the full range of contingencies.' :
            'Readiness is adequate for defensive contingencies; expeditionary tasks would require mobilisation.'
      ]
    });

    if (st.wars.length) {
      st.wars.forEach((w) => {
        const n = w.enemyId ? S.dip(st, w.enemyId) : null;
        const post = S.Mil.POSTURES[w.posture];
        const body = [
          'Current posture: <b>' + post.name + '</b>. Operational tempo ' + S.round(w.intensity, 0) + '/100.',
          'Position: <b>' + (w.score > 25 ? 'advantageous' : w.score < -25 ? 'unfavourable' : 'contested') +
          '</b> (score ' + S.signed(w.score, 0) + ').',
          'Our losses to date: <b>' + S.headcount(w.casualties / 1e6) + '</b>' +
          (w.enemyCasualties ? '; assessed enemy losses ' + S.headcount(w.enemyCasualties / 1e6) : '') + '.',
          'Force exhaustion <b>' + S.round(w.exhaustion, 0) + '</b>; assessed enemy exhaustion <b>' +
          S.round(S.Dip.observed(st, w.enemyExhaustion, 14), 0) + '</b>.',
          'Home front support: <b>' + S.round(w.homeSupport, 0) + '%</b>' +
          (w.homeSupport < 35 ? ' <span class="c-bad">— politically unsustainable</span>' : '') + '.',
          'Cost to the treasury: <b>' + S.money(w.annualCost) + '</b> per year.'
        ];
        if (n && n.nuclear) body.push('<span class="c-warn">The adversary is nuclear-armed. Escalation management must govern every operational decision.</span>');
        body.push('<b>Recommendation:</b> ' + B.warRecommendation(st, w));
        sections.push({ h: w.name, body: body, war: w });
      });
    } else {
      sections.push({
        h: 'Operations', body: ['No active operations. Forces are in routine training and readiness cycles.']
      });
    }

    const proc = [];
    const bmRatio = st.budget.alloc.defense / S.Econ.BENCHMARK.defense;
    proc.push('Defence expenditure <b>' + S.round(st.budget.alloc.defense, 2) + '% of output</b> (' +
      S.money(m.spendAbs) + '), ' + (bmRatio > 1.3 ? 'well above' : bmRatio > 0.9 ? 'around' : 'below') +
      ' the level required to sustain current force structure.');
    proc.push('R&D share of the defence budget: <b>' + st.policy.mil.rndShare + '%</b>. Veteran and personnel support: <b>' +
      st.policy.mil.veteranCare + '/100</b>.');
    if (m.equipment < 45) proc.push('<span class="c-bad">Equipment obsolescence is now the binding constraint on effectiveness.</span>');
    if (S.Soc.militaryLoyalty(st) < 40) proc.push('<span class="c-bad">Officer morale and confidence in the civilian leadership are notably poor.</span>');
    sections.push({ h: 'Procurement and Sustainment', body: proc });

    const comp = rank.slice(0, 6).map((r) =>
      (r.self ? '<b class="c-gold">' + r.name + ' (us)</b>' : r.name) + ' — index ' + S.round(r.power, 1));
    sections.push({ h: 'Comparative Force Ratings', body: comp });

    return {
      title: 'CHIEF OF THE GENERAL STAFF — SITUATION BRIEF',
      classification: 'SECRET — UK EYES EQUIVALENT',
      date: S.dateLong(st.date),
      sections: sections
    };
  };

  B.warRecommendation = function (st, w) {
    if (w.score > 55) return 'The position is strong enough to seek terms from a position of advantage. I would not push for total victory; the marginal gain is small and the marginal risk is not.';
    if (w.score < -45) return 'I recommend disengagement to defensible lines and immediate political contact. The military options remaining are all expensive and none of them are good.';
    if (w.homeSupport < 35) return 'The force can continue. The country cannot. That is a political judgement but I am obliged to report it.';
    if (w.exhaustion > 65) return 'Formations require rotation and refit. I recommend reducing tempo for one operational cycle regardless of the political optics.';
    if (st.military.readiness < 40) return 'Readiness has fallen below sustainable levels. Either reinforce the budget or reduce the tempo.';
    return 'Maintain current posture. The position is contested and neither side has yet found a decisive advantage.';
  };

  /* ---------------------------------------------------- economic report */
  B.economic = function (st) {
    const e = st.economy;
    const sections = [];
    sections.push({
      h: 'Headline Indicators',
      body: [
        'Output <b>' + S.money(e.gdp) + '</b>, growing at <b>' + S.round(e.growth, 1) + '%</b> against estimated potential of ' + S.round(e.potential, 1) + '%.',
        'Inflation <b>' + S.round(e.inflation, 1) + '%</b>; policy rate <b>' + S.round(st.policy.monetary.rate, 1) + '%</b>; ten-year yield <b>' + S.round(e.bondYield, 1) + '%</b>.',
        'Unemployment <b>' + S.round(e.unemployment, 1) + '%</b>. Informal sector <b>' + S.round(e.informal, 0) + '%</b> of activity.',
        'Public debt <b>' + S.round(e.debtGdp, 0) + '%</b> of output; deficit <b>' + S.round((e.deficit / e.gdp) * 100, 1) + '%</b>. Rating <b>' + e.creditRating + '</b>.'
      ]
    });
    sections.push({
      h: 'External Position',
      body: [
        'Exports <b>' + S.money(e.exports) + '</b>, imports <b>' + S.money(e.imports) + '</b>, balance <b>' + S.money(e.tradeBalance) + '</b>.',
        'Currency at <b>' + S.round(e.fx, 1) + '</b> (launch = 100). Reserves <b>' + S.money(e.reserves) + '</b> — ' + S.round(e.reserveMonths, 1) + ' months of imports.',
        e.sanctionPressure > 10 ? '<span class="c-bad">Sanctions pressure index ' + S.round(e.sanctionPressure, 0) + '. Market access constrained.</span>' :
          'No material sanctions burden.'
      ]
    });
    const risks = [];
    if (e.debtGdp > 100) risks.push('Debt sustainability is the dominant medium-term risk.');
    if (e.inflation > 10) risks.push('Inflation is above the level at which expectations de-anchor.');
    if (e.reserveMonths < 3) risks.push('Reserve cover is below the prudential minimum.');
    if (e.unemployment > 12) risks.push('Labour market slack is generating political risk.');
    if (st.flags.bubble) risks.push('Asset valuations appear stretched relative to earnings.');
    if (e.growth < 0) risks.push('The economy is contracting.');
    if (!risks.length) risks.push('No systemic risks flagged this quarter.');
    sections.push({ h: 'Risk Register', body: risks });
    return {
      title: 'TREASURY QUARTERLY ASSESSMENT',
      classification: 'OFFICIAL',
      date: S.dateLong(st.date),
      sections: sections
    };
  };

})(window.S);


/* ==== js/aftermath.js ==== */
/* STRATEGIAN — aftermath.
   Catastrophes are supposed to outlive the headline. A scar is a wound the
   country is still carrying: it drags on growth, on the mood and on the
   quality of whatever it damaged, it gets written about on its anniversary,
   and it schedules the decisions that follow from it — the reconstruction
   money, the inquiry, the memorial — months or years later.              */
(function (S) {
  'use strict';

  const A = S.Aftermath = {};

  /* ---------------------------------------------------------- creation */
  // spec: { id, name, desc, severity 0-100, years, growth, approval, unrest,
  //         qualityDrag: {infra: -8}, tag, deaths }
  A.addScar = function (st, spec) {
    st.scars = st.scars || [];
    const existing = st.scars.find((s) => s.kind === spec.kind);
    if (existing) {
      // A second blow of the same kind compounds rather than replacing.
      existing.severity = S.clamp(existing.severity + spec.severity * 0.6, 0, 130);
      existing.years = Math.max(existing.years, spec.years);
      existing.recurrences = (existing.recurrences || 1) + 1;
      return existing;
    }
    const scar = {
      id: S.uid('scar'), kind: spec.kind || spec.name,
      name: spec.name, desc: spec.desc || '',
      severity: spec.severity, peak: spec.severity, years: spec.years || 4,
      growth: spec.growth || 0, approval: spec.approval || 0, unrest: spec.unrest || 0,
      qualityDrag: spec.qualityDrag || {},
      deaths: spec.deaths || 0,
      startDay: S.absDay(st.date), startLabel: S.dateLabel(st.date),
      startYear: st.date.year, lastAnniversary: st.date.year,
      tag: spec.tag || 'disaster'
    };
    st.scars.push(scar);
    if (scar.deaths) {
      st.national.totalDeaths = (st.national.totalDeaths || 0) + scar.deaths;
      st.pop.total = Math.max(0.05, st.pop.total - scar.deaths / 1e6);
    }
    return scar;
  };

  /* ------------------------------------------------- ongoing influences */
  /* Scars are meant to be a persistent weight, not an accumulating spiral.
     Each channel is capped so that a run of bad luck stays survivable and
     the country's own condition decides whether it breaks.               */
  A.growthDrag = function (st) {
    let d = 0;
    (st.scars || []).forEach((s) => { d += s.growth * (s.severity / 100); });
    return S.clamp(d, -1.8, 0);
  };
  A.approvalOffset = function (st) {
    let d = 0;
    (st.scars || []).forEach((s) => { d += s.approval * (s.severity / 100); });
    return S.clamp(d, -9, 0);
  };
  A.unrestOffset = function (st) {
    let d = 0;
    (st.scars || []).forEach((s) => { d += s.unrest * (s.severity / 100); });
    return S.clamp(d, 0, 11);
  };
  // Subtracted from a quality stock's funding target, so the thing that was
  // broken stays visibly broken until the scar fades.
  A.qualityDrag = function (st, key) {
    let d = 0;
    (st.scars || []).forEach((s) => {
      if (s.qualityDrag[key]) d += s.qualityDrag[key] * (s.severity / 100);
    });
    return S.clamp(d, -26, 0);
  };

  /* ------------------------------------------------------------- clock */
  A.tick = function (st, dt) {
    st.scars = st.scars || [];
    for (let i = st.scars.length - 1; i >= 0; i--) {
      const s = st.scars[i];
      // Recovery is faster where the state is capable and solvent.
      const capacity = 0.6 + (st.quality.admin / 100) * 0.5 +
        (st.economy.growth > 0 ? 0.2 : -0.2) - (st.economy.financingGap > 0 ? 0.25 : 0);
      s.severity -= (100 / Math.max(0.5, s.years)) * S.clamp(capacity, 0.25, 1.6) * dt;
      if (s.severity <= 3) {
        st.scars.splice(i, 1);
        S.game.event('The country has largely put ' + s.name + ' behind it.', 'good');
        continue;
      }
      // An anniversary is a fact of national life, not a modifier.
      if (st.date.year > s.lastAnniversary && st.date.dayOfYear >= 3 &&
        Math.abs(S.absDay(st.date) - s.startDay) % 365 < 1.5) {
        s.lastAnniversary = st.date.year;
        A.anniversary(st, s);
      }
    }
    A.runScheduled(st);
  };

  A.anniversary = function (st, s) {
    const years = st.date.year - s.startYear;
    if (years < 1) return;
    const ordinal = S.ordinal(years);
    const lines = s.deaths > 0 ? [
      ordinal + ' Anniversary of ' + s.name + ': The Names Are Read Again',
      'A Nation Pauses on the ' + ordinal + ' Anniversary of ' + s.name,
      ordinal + ' Anniversary: Families Still Waiting for Answers on ' + s.name
    ] : [
      ordinal + ' Anniversary of ' + s.name,
      'Recovery from ' + s.name + ' Still Incomplete After ' + years + ' Years'
    ];
    S.News.custom(st, st.rng.pick(lines), s.severity > 45 ? 'bad' : '',
      s.deaths > 0 ? S.num(s.deaths) + ' dead · ' + S.round(s.severity, 0) + '/100 of the damage remains'
        : S.round(s.severity, 0) + '/100 of the damage remains');
    // Grief and anger both spike briefly.
    st.society.cohesion += 2;
    if (s.severity > 50) st.society.unrest += 2;
  };

  /* Occasional press recall, used by the ambient news generator. */
  A.recall = function (st) {
    const live = (st.scars || []).filter((s) => s.severity > 12);
    if (!live.length) return false;
    const s = st.rng.pick(live);
    const years = Math.max(1, st.date.year - s.startYear);
    const lines = [
      years + ' Years On, ' + s.name + ' Still Shapes the Budget',
      'Thousands Remain in Temporary Housing Since ' + s.name,
      'Auditors Question the Pace of Recovery from ' + s.name,
      'Region Hit by ' + s.name + ' Reports Continued Population Loss',
      'Survivors of ' + s.name + ' Petition for Compensation'
    ];
    S.News.custom(st, st.rng.pick(lines), 'bad');
    return true;
  };

  /* -------------------------------------------------- deferred matters */
  // Consequences that arrive on a delay: the reconstruction bill, the
  // inquiry that reports two years later, the veterans' settlement.
  A.schedule = function (st, decisionId, ctx, days) {
    st.scheduled = st.scheduled || [];
    st.scheduled.push({ day: S.absDay(st.date) + days, decisionId: decisionId, ctx: ctx || {} });
  };

  A.runScheduled = function (st) {
    if (!st.scheduled || !st.scheduled.length) return;
    const now = S.absDay(st.date);
    for (let i = st.scheduled.length - 1; i >= 0; i--) {
      if (st.scheduled[i].day <= now) {
        const item = st.scheduled[i];
        st.scheduled.splice(i, 1);
        S.game.pushDecision(item.decisionId, item.ctx);
      }
    }
  };

  /* ----------------------------------------- catastrophe rate limiting */
  // A once-in-a-generation event should feel like one. Nothing tagged
  // catastrophic can fire while the country is still absorbing the last.
  A.CATASTROPHE_GAP = 365 * 7;
  A.canCatastrophe = function (st) {
    const last = st.counters.lastCatastropheDay || 0;
    if (!last) return true;
    return (S.absDay(st.date) - last) >= A.CATASTROPHE_GAP;
  };
  A.markCatastrophe = function (st) {
    st.counters.lastCatastropheDay = S.absDay(st.date);
  };

  A.summary = function (st) {
    return (st.scars || []).slice().sort((a, b) => b.severity - a.severity);
  };

})(window.S);


/* ==== js/actions.js ==== */
/* STRATEGIAN — initiatives.
   Everything here is something you do rather than something you answer.
   One-off actions resolve immediately; programmes run for years, cost money
   every one of them, and deliver their payoff at the end.                */
(function (S) {
  'use strict';

  const Act = S.Actions = {};

  /* ======================================================== PROGRAMMES */
  Act.startProgramme = function (st, spec) {
    st.programmes = st.programmes || [];
    if (st.programmes.some((p) => p.key === spec.key)) return null;
    const p = {
      id: S.uid('prog'), key: spec.key, name: spec.name, dept: spec.dept,
      desc: spec.desc || '', years: spec.years, elapsed: 0,
      costPct: spec.costPct, perYear: spec.perYear || {}, onComplete: spec.key,
      covert: !!spec.covert,
      started: S.dateLabel(st.date)
    };
    st.programmes.push(p);
    // Covert programmes do not get announced in the press.
    if (!spec.covert) {
      S.News.custom(st, spec.headline || (spec.name + ' Begins'), 'good',
        S.round(spec.costPct, 2) + '% of output a year for ' + spec.years + ' years');
    }
    return p;
  };

  // Completion payoffs, keyed by programme. Kept separate so a programme
  // survives a save/load round trip without carrying functions.
  Act.COMPLETION = {
    hospitals: (st) => { st.quality.health += 10; st.society.approval += 5; return 'The last of the new hospitals has opened. Waiting lists are measurably shorter.'; },
    vaccination: (st) => { st.quality.health += 6; st.pop.growth += 0.05; return 'The immunisation campaign has reached national coverage.'; },
    literacy: (st) => { st.quality.education += 9; st.economy.productivity += 3; return 'The literacy campaign has closed with attainment sharply higher.'; },

  Act.programmeTick = function (st, dt) {
    st.programmes = st.programmes || [];
    let cost = 0;
    for (let i = st.programmes.length - 1; i >= 0; i--) {
      const p = st.programmes[i];
      cost += (p.costPct / 100) * st.economy.gdp;
      p.elapsed += dt;
      // Steady delivery along the way, so progress is visible before the end.
      for (const path in p.perYear) S.addPath(st, path, p.perYear[path] * dt);
      if (p.elapsed >= p.years) {
        st.programmes.splice(i, 1);
        const fn = Act.COMPLETION[p.key];
        const text = fn ? fn(st) : (p.name + ' is complete.');
        S.game.event(text, 'good');
        if (!p.covert) S.News.custom(st, p.name + ' Completed', 'good');
      }
    }
    st.economy.programmeSpending = cost;
  };

  Act.cancelProgramme = function (st, id) {
    const i = st.programmes.findIndex((p) => p.id === id);
    if (i < 0) return;
    const p = st.programmes[i];
    st.programmes.splice(i, 1);
    if (p.covert) {
      S.game.event(p.name + ' has been quietly dismantled. The money already spent is gone.', '');
      return;
    }
    st.society.approval -= 3;
    st.national.prestige -= 1;
    S.game.event(p.name + ' has been cancelled. The money already spent is gone.', 'bad');
    S.News.custom(st, p.name + ' Cancelled Mid-Delivery', 'bad');
  };

  /* ========================================================== HELPERS */
  /* Operations have real price tags that do not scale linearly with the
     economy: a nuclear test costs what a nuclear test costs. `cost.money`
     is an absolute figure (billions, at a mid-sized economy) scaled gently
     by economic weight; `cost.moneyPct` scales with GDP. When both are
     present the charge is the smaller — %GDP for small economies, the
     absolute figure as a cap for large ones. */
  Act.opScale = function (st) {
    return S.clamp(Math.pow(st.economy.gdp / 2000, 0.35), 0.25, 4);
  };
  Act.opCost = function (st, a) {
    if (!a.cost) return 0;
    const pct = a.cost.moneyPct ? (a.cost.moneyPct / 100) * st.economy.gdp : null;
    const abs = a.cost.money != null ? a.cost.money * Act.opScale(st) : null;
    if (pct != null && abs != null) return Math.min(pct, abs);
    return pct != null ? pct : (abs != null ? abs : 0);
  };

  function pay(st, amount) {
    const fromReserves = Math.min(st.economy.reserves, amount);
    st.economy.reserves -= fromReserves;
    st.economy.debt += amount - fromReserves;
    return amount;
  }
  Act.pay = pay;

  /* ------------------------------------------------------ availability */
  Act.forDept = function (st, dept) {
    return Act.LIB.filter((a) => a.dept === dept);
  };
  Act.status = function (st, a) {
    const cd = (st.actionCooldown || {})[a.id];
    if (cd && S.absDay(st.date) < cd) {
      return { ok: false, reason: 'Available again in ' + S.round(cd - S.absDay(st.date), 0) + ' days' };
    }
    if (a.requires && !a.requires(st)) {
      return { ok: false, reason: a.unavailable ? a.unavailable(st) : 'Not available now' };
    }
    const money = Act.opCost(st, a);
    if (money > 0 && st.economy.reserves + st.economy.gdp * 0.05 < money) {
      return { ok: false, reason: 'The Treasury cannot fund it' };
    }
    return { ok: true };
  };

  Act.costLabel = function (st, a) {
    const bits = [];
    const money = Act.opCost(st, a);
    if (money) bits.push(S.money(money) + (a.programme ? '/yr' : ''));
    if (a.cost && a.cost.approval) bits.push('Approval ' + S.signed(a.cost.approval, 0));
    if (a.cost && a.cost.unrest) bits.push('Unrest ' + S.signed(a.cost.unrest, 0));
    if (a.programme) bits.push('multi-year programme');
    return bits.length ? bits.join(' · ') : 'No direct cost';
  };

  /* ---------------------------------------------------------- execute */
  Act.run = function (st, a, target) {
    const s = Act.status(st, a);
    if (!s.ok) return null;
    st.actionCooldown = st.actionCooldown || {};
    st.actionCooldown[a.id] = S.absDay(st.date) + (a.cooldown || 365);

    if (a.cost) {
      if (!a.programme) {
        const amt = Act.opCost(st, a);
        if (amt) pay(st, amt);
      }
      if (a.cost.approval) st.society.approval += a.cost.approval;
      if (a.cost.unrest) st.society.unrest += a.cost.unrest;
    }
    let text = '';
    try { text = a.run(st, target) || ''; } catch (e) { console.warn(e); }

    S.game.clampState(st);
    st.log.unshift({
      date: S.dateLabel(st.date), title: a.name, choice: 'Initiative' + (target ? ' — ' + target.name : ''),
      cat: a.dept, initiative: true
    });
    if (st.log.length > 300) st.log.length = 300;
    S.game.event(text, 'good');
    return text;
  };

})(window.S);

  D.FACTION_LABEL = FACTION_LABEL;

  /* ===================================================== VARIATION =======

    return arr[ctx._v[key] % arr.length];
  };

    if (ctx._f) return ctx._f;
    const F = S.FLAVOUR;
    ctx._f = {
      region: st.rng.pick(F.regions),
      region2: st.rng.pick(F.regions),
      city: st.rng.pick(F.cities),
      industry: st.rng.pick(F.industries),
      industry2: st.rng.pick(F.industries),
      firm: st.rng.pick(F.firms),
      official: st.rng.pick(F.officials),
      union: st.rng.pick(F.unions),
      university: st.rng.pick(F.universities)
    };
    return ctx._f;
  };

  /* ------------------------------------------------- the paper trail ----
     Matters can look back at what you decided before. This is what lets a
     nationalisation produce an arbitration ruling two years later, or a
     press crackdown produce a foreign delegation asking about it.       */
  D.ruled = function (st, id) { return !!(st.rulings && st.rulings[id]); };
  D.chose = function (st, id, i) {
    const r = st.rulings && st.rulings[id];
    if (!r) return false;
    return Array.isArray(i) ? i.indexOf(r.i) >= 0 : r.i === i;
  };
  D.ruling = function (st, id) { return (st.rulings && st.rulings[id]) || null; };
  D.yearsSince = function (st, id) {
    const r = D.ruling(st, id);
    return r ? (S.absDay(st.date) - r.day) / 365 : null;
  };
  // "the nationalisation of four years ago" — phrasing for callbacks.
  D.ago = function (st, id) {
    const y = D.yearsSince(st, id);
    if (y == null) return 'earlier';
    if (y < 1.2) return 'last year';
    if (y < 2.2) return 'two years ago';
    if (y < 3.2) return 'three years ago';
    if (y < 6) return Math.round(y) + ' years ago';
    return 'a long time ago now';

    if (ctx.kind) return ctx;
    ctx.kind = st.rng.pick(['flood', 'earthquake', 'cyclone', 'wildfire complex', 'drought']);

    // A disaster strikes a region, not a nation. The affected population grows
    // with the country but nothing like linearly, so a vast state does not
    // automatically suffer a vast death toll.
    const affected = Math.min(st.pop.total, 8 + st.pop.total * 0.10) * 1e6;
    // Vulnerability is infrastructure, health capacity and warning time.

    ctx.deaths = Math.round(affected * st.rng.range(0.00025, 0.0009) * vuln);
    ctx.displaced = Math.round(ctx.deaths * st.rng.int(18, 45));
    return ctx;
  };

  };

/* STRATEGIAN — random events.
   These fire without warning. Most resolve themselves and simply move the
   numbers; some open a decision that lands in your inbox immediately.   */
(function (S) {
  'use strict';

  const E = S.Events = {};

  function ev(id, weight, fire) { return { id, weight, fire }; }
  const always = () => 6;

  E.LIB = [
    /* ------------------------------------------------------- economic */
    ev('commodity_find', (st) => st.economy.sectors.resources > 4 ? 5 : 2, (st) => {
      const size = st.rng.range(0.5, 2.4);
      st.economy.sectors.resources += size * 0.8;
      st.economy.shock += size * 0.5;
      st.national.prestige += 1;
      S.News.custom(st, 'Major Mineral Discovery in the Interior', 'good',
        'Survey teams confirm a deposit large enough to alter the national export profile.');
      return 'A significant resource deposit has been confirmed. The exploration licence auction begins next quarter.';
    }),
    ev('foreign_investment', (st) => st.economy.businessConfidence > 55 ? 7 : 2, (st) => {
      const amt = st.economy.gdp * st.rng.range(0.004, 0.016);
      st.economy.shock += 0.5; st.economy.reserves += amt * 0.4;
      st.economy.businessConfidence += 4;
      S.News.custom(st, 'Foreign Consortium Announces Major Plant Investment', 'good');
      return 'A foreign consortium has committed ' + S.money(amt) + ' to a new industrial facility.';
    }),
    ev('capital_flight', (st) => st.economy.businessConfidence < 35 || st.society.stability < 40 ? 8 : 1, (st) => {
      st.economy.reserves -= st.economy.gdp * st.rng.range(0.005, 0.02);
      st.economy.fx *= 0.97; st.economy.shock -= 0.6;
      S.News.custom(st, 'Capital Outflows Accelerate as Confidence Erodes', 'bad');
      return 'Net capital outflows have accelerated sharply. Foreign reserves are falling.';
    }),
    ev('bank_failure', (st) => (st.policy.monetary.rate > 12 || st.economy.growth < -1) ? 6 : 1, (st) => {
      st.economy.shock -= 1.4; st.economy.businessConfidence -= 12;
      st.economy.debt += st.economy.gdp * 0.012;
      S.game.pushDecision('bank_rescue', {});
      S.News.custom(st, 'Major Lender Fails; Depositors Queue at Branches', 'bad');
      return 'The country\'s third-largest lender has failed. Depositors are queueing to withdraw funds.';
    }),
    ev('tech_breakthrough', (st) => st.quality.science > 55 ? 6 : 1, (st) => {
      st.quality.science += 2.5; st.economy.productivity += 1.5; st.national.prestige += 3;
      S.News.push(st, 'tech', {});
      return 'National laboratories have announced a breakthrough with commercial applications.';
    }),
    ev('harvest_failure', (st) => 4 + st.world.climate * 0.06, (st) => {
      st.world.grain *= 1.12; st.economy.inflation += 1.2; st.society.unrest += 3;
      st.economy.shock -= 0.5;
      S.News.custom(st, 'Harvest Falls Well Below Forecast', 'bad', 'Food price pressure expected through the winter.');
      return 'The harvest has failed across three provinces. Food prices are rising.';
    }),

        swf: arch.id === 'petro' ? arch.gdp * 0.6 : null,
        defaultHistory: arch.id === 'developing' || arch.id === 'postconflict' ? 1 : 0,
        revenueBreakdown: {}, programSpending: 0, warSpending: 0
      },
      quality: {
        education: arch.society.education, health: arch.society.health, infra: arch.society.infra,
        science: arch.tech, culture: arch.society.culture, security: 50,
        energy: 45 + arch.society.infra * 0.2, admin: S.clamp(85 - arch.society.corruption * 0.6, 10, 95),
        welfareQ: S.clamp(arch.society.health * 0.6 + 20, 5, 95)
      },
      society: {
        approval: arch.society.approval, approvalTrue: arch.society.approval,
        unrest: S.clamp(60 - arch.society.stability * 0.6, 3, 90),
        stability: arch.society.stability, corruption: arch.society.corruption,
        freedom: arch.society.freedom, inequality: arch.society.inequality,
        latent: 10, repression: 0, legitimacy: 55, cohesion: 55,
        crime: S.clamp(70 - arch.society.stability * 0.5, 5, 95),
        honeymoon: 6, scandal: 0
      },
      national: {
        prestige: arch.prestige, softPower: arch.society.culture * 0.7 + 10,
        diplomaticWins: 0, diplomaticLosses: 0, concessions: 0,
        aggressionScore: 0, warsWon: 0, warsLost: 0, lastElection: null
      },
      military: {
        manpower: arch.military.manpower, equipment: arch.military.equipment,
        readiness: arch.military.readiness, tech: arch.tech * 0.85,
        morale: 55, logistics: 40 + arch.society.infra * 0.4, veterancy: 25,
        nuclear: arch.military.nuclear, quality: 50, power: 10, spendAbs: 0,
        nuclearPosture: arch.military.nuclear > 60 ? 'assured' : arch.military.nuclear > 10 ? 'minimal' : 'renounced'
      },
      intel: {
        strength: arch.intel, accuracy: 0.5, coverage: arch.intel,
        ops: [], compartmented: false
      },
      policy: G.defaultPolicy(arch),
      budget: { alloc: G.defaultBudget(arch) },
      factions: S.FACTIONS.map((f) => ({
        id: f.id,
        power: G.factionPower(f.id, arch, govDef),
        loyalty: G.factionLoyalty(f.id, arch, govDef)
      })),
      diplomacy: { nations: [], treaties: [] },
      world: {
        oil: 100, grain: 100, growth: 2.7, inflation: 2.6, rate: 3.2, market: 100,
        tension: 32, climate: 30, techLevel: 100, globalWars: 0
      },
      wars: [], foreignWars: [],
      scars: [], scheduled: [], programmes: [], actionCooldown: {}, rulings: {},
      autoPaused: false, resumeSpeed: 1,
      inbox: [], headlines: [], log: [], news: {},
      flags: { aidRecipient: arch.tags.indexOf('Aid dependent') >= 0 || arch.tags.indexOf('IMF programme') >= 0 },
      counters: { decisionCooldown: {} },
      risk: { coup: 0, civilWar: 0, collapse: 0 },
      victoryProgress: {}, peaceStreak: 0,
      negotiation: null, ended: null,
      settings: { autoPause: true, autoResume: true, theme: cfg.theme || 'dark' }
    };

    // Foreign powers.
    st.diplomacy.nations = S.WORLD_NATIONS.map((n) => {
      const defenseShare = n.ideology === 'authoritarian' || n.ideology === 'party' ? 3.6 :
        n.ideology === 'liberal' ? 2.0 : 2.5;
      return {
        id: n.id, name: n.name, adj: n.adj, color: n.color, region: n.region,
        power: n.power, ideology: n.ideology, personality: n.personality,
        gdp: n.gdp, nuclear: n.nuclear, nuclearLevel: n.nuclear ? 60 + rng.range(0, 30) : 0,
        notes: n.notes,
        defenseShare: defenseShare, milQuality: 35 + n.power * 0.55, manpower: n.gdp / 2400,
        milPower: 10,
        relation: 0, relationTarget: 0, affinity: 20, threatPerception: 20,
        trust: 50, grievance: 0, tradeVolume: 0, tradeStatus: 'normal',
        treaties: [], allyOfUs: false, atWar: false, sanctioningUs: false,
        stance: 'neutral', cooldown: 0, blocOf: null, warSupport: 1
      };
    });

    // Opening relations reflect ideology and archetype.
    st.diplomacy.nations.forEach((n) => {
      const gap = S.Dip.ideologyGap(st, n);
      n.relation = S.clamp(30 - gap * 0.65 + rng.range(-12, 12), -80, 80);
      n.affinity = S.clamp(20 + (arch.society.culture - 40) * 0.35 - gap * 0.15, 0, 80);
      if (st.economy.sanctionPressure > 20 && (n.ideology === 'liberal' || n.ideology === 'democratic')) {
        n.sanctioningUs = true; n.relation -= 30;
      }
      n.tradeVolume = st.economy.gdp * 0.006 * (n.gdp / 4000);
    });

    S.Mil.recomputeForeign(st);
    S.Mil.recompute(st);
    S.Econ.updateTrade(st);

    if (arch.startWars.indexOf('insurgency') >= 0) {
      S.Mil.startInsurgency(st, 'The Northern Insurgency');
    }

    // Content cadence is measured from today, not from year zero, so nothing
    // fires on the first tick.
    G.buildRoster(st);
    const day0 = S.absDay(st.date);
    st.counters.lastDecisionDay = day0 + 4;
    st.counters.lastEventDay = day0 + 12;
    st.counters.lastAmbientDay = day0;

    G.state = st;
    S.game.state = st;

    // Seed the news feed so the first screen is not empty.
    S.News.custom(st, st.nation.leaderTitle + ' ' + st.nation.leader + ' Takes Office', 'good',
      'A new administration inherits ' + (st.economy.debtGdp > 90 ? 'a debt problem' :
        st.society.unrest > 45 ? 'a restive country' : 'a country waiting to see'));
    for (let i = 0; i < 3; i++) S.News.ambient(st);
    G.event('You have taken office. The country is yours to run.', 'good');
    return st;
  };

  G.sectorsFor = function (arch) {
    const map = {
      hegemon: { agri: 1, industry: 18, services: 62, resources: 5, tech: 14 },
      continental: { agri: 5, industry: 30, services: 40, resources: 21, tech: 4 },
      industrial: { agri: 1, industry: 30, services: 55, resources: 2, tech: 12 },
      rising: { agri: 16, industry: 26, services: 46, resources: 6, tech: 6 },
      petro: { agri: 2, industry: 14, services: 40, resources: 42, tech: 2 },
      entrepot: { agri: 0, industry: 18, services: 66, resources: 1, tech: 15 },
      developing: { agri: 22, industry: 22, services: 44, resources: 10, tech: 2 },
      postconflict: { agri: 34, industry: 14, services: 40, resources: 11, tech: 1 }
    };
    return map[arch.id] || map.developing;
  };

  G.defaultPolicy = function (arch) {
    const dev = arch.gdp / arch.pop; // per-capita output, in thousands
    const rich = dev > 20;
    // Fiscal capacity rises with development — poor states cannot collect
    // income tax at European rates however much they might like to.
    const cap = S.sat(dev, 25);
    const petro = arch.id === 'petro';
    return {
      tax: {
        income: petro ? 10 : S.round(20 + 22 * cap, 0),
        corporate: petro ? 12 : (rich ? 24 : 26),
        vat: petro ? 6 : S.round(11 + 10 * cap, 0),
        wealth: rich ? 0.6 : 0.2
      },
      monetary: {
        rate: arch.economy.rate, emission: 50, regime: arch.id === 'petro' ? 'peg' : 'float',
        capitalControls: arch.id === 'continental' || arch.id === 'postconflict' ? 35 : 8
      },
      econ: {
        stateOwnership: arch.id === 'continental' ? 45 : arch.id === 'petro' ? 55 : arch.id === 'postconflict' ? 30 : 18,
        regulation: rich ? 52 : 44, laborProtection: rich ? 58 : 40,
        subsidies: arch.id === 'petro' ? 62 : arch.id === 'developing' ? 45 : 25,
        priceControls: false
      },
      trade: { tariff: rich ? 3 : 11, openness: rich ? 72 : 50 },
      mil: {
        conscription: arch.military.manpower > 0.8 ? 45 : 10,
        doctrine: arch.military.doctrine,
        nuclearPosture: arch.military.nuclear > 60 ? 'assured' : arch.military.nuclear > 10 ? 'minimal' : 'renounced',
        readinessTarget: arch.military.readiness, rndShare: rich ? 22 : 10, veteranCare: rich ? 55 : 32
      },
      interior: {
        policing: 45, surveillance: S.clamp(70 - arch.society.freedom * 0.6, 10, 90),
        pressFreedom: arch.society.freedom, civilLiberties: arch.society.freedom,
        propaganda: S.clamp(60 - arch.society.freedom * 0.5, 5, 80),
        immigration: rich ? 45 : 25, anticorruption: 30
      },
      social: {
        eduUniversity: 30, traditionalism: S.clamp(70 - arch.society.education * 0.4, 15, 85),
        devolution: 35, familyPolicy: 30
      },
      energy: { transition: rich ? 35 : 15, reserves: 40 },
      foreign: {
        stance: arch.id === 'hegemon' ? 'interventionist' : arch.id === 'entrepot' ? 'engaged' : 'defensive',
        aid: rich ? 30 : 8
      }
    };
  };

  G.defaultBudget = function (arch) {
    const b = {};
    for (const m in S.Econ.BENCHMARK) b[m] = S.Econ.BENCHMARK[m];
    const dev = arch.gdp / arch.pop;
    const poor = dev < 8;
    b.defense = arch.military.manpower * 1.25 + arch.military.equipment * 0.018;
    b.defense = S.clamp(b.defense, 0.9, 6.5);
    if (poor) {
      b.welfare *= 0.32; b.health *= 0.55; b.education *= 0.7; b.research *= 0.35;
      b.culture *= 0.5; b.foreign *= 0.4; b.energy *= 0.7; b.admin *= 0.85;
    }
    if (arch.id === 'petro') { b.welfare *= 1.2; b.energy *= 1.4; b.research *= 0.6; }
    if (arch.id === 'continental') { b.welfare *= 0.72; b.health *= 0.68; b.education *= 0.8; b.research *= 0.7; }
    if (arch.id === 'entrepot') {
      // A small, efficient state with no hinterland and a young population.
      for (const k in b) b[k] *= 0.66;
      b.defense = 2.9; b.infra *= 1.5; b.education *= 1.4; b.admin *= 1.3;
    }
    if (arch.id === 'rising') { b.welfare *= 0.85; b.infra *= 1.15; }
    if (arch.id === 'postconflict') { b.interior *= 1.6; b.infra *= 0.6; b.welfare *= 0.8; }
    // Rich, well-run states start above benchmark — which is why their public
    // services are good, and why letting them slip to benchmark is a choice.
    if (dev > 30) { b.education *= 1.25; b.health *= 1.15; b.research *= 1.3; b.admin *= 1.1; }
    b.intel = S.clamp(arch.intel * 0.008, 0.12, 1.1);
    for (const k in b) b[k] = S.round(b[k], 2);
    return b;
  };

  G.factionPower = function (id, arch, govDef) {
    const base = {
      military: 45, business: 55, labour: 45, intelligentsia: 40,
      clergy: 35, nationalists: 40, reformers: 35, provinces: 40
    }[id];
    let p = base;
    if (govDef.id === 'junta' && id === 'military') p += 35;
    if (govDef.id === 'theocratic' && id === 'clergy') p += 35;
    if (govDef.id === 'party' && id === 'labour') p += 10;
    if (govDef.id === 'liberal' && (id === 'intelligentsia' || id === 'reformers')) p += 12;
    if (govDef.id === 'technocracy' && id === 'intelligentsia') p += 20;
    if (arch.society.education > 75 && (id === 'intelligentsia' || id === 'reformers')) p += 8;
    if (arch.society.education < 45 && id === 'clergy') p += 12;
    if (arch.gdp / arch.pop > 25 && id === 'business') p += 10;
    if (arch.id === 'postconflict' && id === 'military') p += 20;
    if (arch.pop > 300 && id === 'provinces') p += 12;
    return S.clamp(p, 10, 100);
  };

  G.factionLoyalty = function (id, arch, govDef) {
    let l = 55;
    if (govDef.id === 'junta' && id === 'military') l += 25;
    if (govDef.id === 'theocratic' && id === 'clergy') l += 25;
    if (govDef.id === 'liberal' && (id === 'reformers' || id === 'intelligentsia')) l += 12;
    if (govDef.id === 'personalist' && id === 'reformers') l -= 20;
    if (arch.society.corruption > 60 && id === 'reformers') l -= 15;
    if (arch.society.freedom < 35 && id === 'intelligentsia') l -= 15;
    return S.clamp(l + (arch.society.approval - 50) * 0.3, 10, 92);
  };

  /* ============================================================== CLOCK */
  G.timer = null;
  G.setSpeed = function (s) {
    const st = G.state;
    if (!st || st.ended) return;
    st.speed = s;
    if (s > 0) st.lastSpeed = s;
    if (G.timer) { clearInterval(G.timer); G.timer = null; }
    if (s > 0) G.timer = setInterval(G.tick, G.SPEEDS[s]);
    if (S.UI) S.UI.refreshTopbar();
  };
  G.togglePause = function () {
    const st = G.state; if (!st) return;
    // A deliberate pause is yours to undo; it clears the automatic one.
    st.autoPaused = false;
    G.setSpeed(st.speed > 0 ? 0 : (st.lastSpeed || 1));
  };
  /* The clock stops itself for anything urgent and starts itself again once
     you have dealt with it, so the only pauses you manage are your own. */
  G.pauseForDecision = function () {
    const st = G.state;
    if (!st || !st.settings.autoPause || st.speed === 0) return;
    st.autoPaused = true;
    st.resumeSpeed = st.speed;
    G.setSpeed(0);
  };

  G.resumeAfterDecision = function () {
    const st = G.state;
    if (!st || st.ended || !st.autoPaused) return;
    if (!st.settings.autoResume) return;
    // Stay stopped while anything urgent is still outstanding, or while a
    // negotiation is open — those are deliberately turn-based.
    if (st.negotiation) return;
    if (st.inbox.some((i) => i.urgency === 'urgent')) return;
    st.autoPaused = false;
    if (st.speed === 0) G.setSpeed(st.resumeSpeed || st.lastSpeed || 1);
  };

  /* --------------------------------------------------------------- tick */
  G.tick = function () {
    const st = G.state;
    if (!st || st.ended) return;
    const dt = 1 / 365;

    // advance the calendar
    const d = st.date;
    d.day++; d.dayOfYear++;
    const dim = S.DAYS_IN_MONTH[d.month] + (d.month === 1 && d.year % 4 === 0 ? 1 : 0);
    if (d.day > dim) { d.day = 1; d.month++; }
    if (d.month > 11) { d.month = 0; d.year++; d.dayOfYear = 1; G.onNewYear(st); }

    // simulation
    S.Econ.worldTick(st, dt);
    S.Econ.tick(st, dt);
    S.Soc.tick(st, dt);
    S.Mil.tick(st, dt);
    S.Dip.tick(st, dt);
    S.Actions.programmeTick(st, dt);
    S.Aftermath.tick(st, dt);
    G.updateIntel(st, dt);

    if (d.day === 1) G.onNewMonth(st);

    // content cadence
    const abs = S.absDay(d);
    if (abs - st.counters.lastDecisionDay >= G.decisionInterval(st) && st.inbox.length < G.MAX_INBOX) {
      st.counters.lastDecisionDay = abs;
      G.rollDecision(st);
    }
    if (abs - st.counters.lastEventDay >= st.rng.int(30, 55)) {
      st.counters.lastEventDay = abs;
      G.rollEvent(st);
    }
    if (abs - st.counters.lastAmbientDay >= st.rng.int(6, 13)) {
      st.counters.lastAmbientDay = abs;
      S.News.ambient(st);
    }

    // deadlines
    for (let i = st.inbox.length - 1; i >= 0; i--) {
      const item = st.inbox[i];
      item.daysLeft--;
      if (item.daysLeft <= 0) {
        st.inbox.splice(i, 1);
        G.resolveDefault(st, item);
      }
    }

    G.clampState(st);
    S.News.watch(st);
    const dead = S.Soc.dangerCheck(st, dt);
    if (dead) return;
    G.checkVictory(st);

    // record history for charts, weekly
    if (abs % 7 === 0) G.recordHistory(st);

    if (S.UI) S.UI.onTick();
  };

  /* Decisions and events write directly into the state, so everything that is
     nominally a 0–100 index gets pulled back into range once per day. */
  G.clampState = function (st) {
    const s = st.society;
    ['approval', 'approvalTrue', 'unrest', 'stability', 'corruption', 'freedom',
      'inequality', 'latent', 'legitimacy', 'cohesion', 'crime', 'repression'].forEach((k) => {
        if (typeof s[k] === 'number') s[k] = S.clamp(s[k], 0, 100);
      });
    st.national.prestige = S.clamp(st.national.prestige, 0, 100);
    st.national.softPower = S.clamp(st.national.softPower, 0, 100);
    st.national.concessions = Math.max(0, st.national.concessions);
    for (const k in st.quality) st.quality[k] = S.clamp(st.quality[k], 0, 100);
    ['readiness', 'morale', 'equipment', 'tech', 'logistics', 'veterancy', 'nuclear']
      .forEach((k) => { st.military[k] = S.clamp(st.military[k], 0, 100); });
    st.military.manpower = Math.max(0.001, st.military.manpower);
    st.intel.strength = S.clamp(st.intel.strength, 0, 100);
    st.world.tension = S.clamp(st.world.tension, 0, 100);
    st.world.climate = S.clamp(st.world.climate, 0, 100);
    st.economy.reserves = Math.max(0, st.economy.reserves);
    st.economy.gdp = Math.max(0.5, st.economy.gdp);
    st.economy.gdpReal = Math.max(0.5, st.economy.gdpReal);
    st.pop.total = Math.max(0.05, st.pop.total);
    for (const m in st.budget.alloc) st.budget.alloc[m] = S.clamp(st.budget.alloc[m], 0, 30);
    for (const g in st.policy) {
      for (const k in st.policy[g]) {
        const v = st.policy[g][k];
        if (typeof v !== 'number') continue;
        if (g === 'tax' && k === 'wealth') st.policy[g][k] = S.clamp(v, 0, 12);
        else if (g === 'monetary' && k === 'rate') st.policy[g][k] = S.clamp(v, 0, 40);
        else st.policy[g][k] = S.clamp(v, 0, 100);
      }
    }
    st.factions.forEach((f) => { f.loyalty = S.clamp(f.loyalty, 0, 100); f.power = S.clamp(f.power, 5, 100); });
    st.diplomacy.nations.forEach((n) => {
      n.relation = S.clamp(n.relation, -100, 100);
      n.affinity = S.clamp(n.affinity, 0, 100);
      n.grievance = S.clamp(n.grievance || 0, 0, 100);
    });
    st.wars.forEach((w) => {
      w.intensity = S.clamp(w.intensity, 5, 100);
      w.homeSupport = S.clamp(w.homeSupport, 0, 100);
      w.score = S.clamp(w.score, -100, 100);
    });
  };

  G.decisionInterval = function (st) {
    // Crises come faster; calm periods breathe. A busy desk is the point —
    // what keeps it from exhausting the library is the size of the library.
    let base = 15;
    if (st.wars.length) base -= 3;
    if (st.society.unrest > 55) base -= 2;
    if (st.society.stability > 75 && !st.wars.length) base += 5;
    return S.clamp(base + st.rng.int(-4, 7), 6, 30);
  };

  G.updateIntel = function (st, dt) {
    const ratio = st.budget.alloc.intel / S.Econ.BENCHMARK.intel;
    const gov = S.govMods(st);
    const target = S.clamp(18 + 46 * Math.pow(S.clamp(ratio, 0, 3), 0.5) *
      (0.6 + 0.4 * st.quality.admin / 70) * (gov.intelPenalty || 1) +
      st.policy.interior.surveillance * 0.12, 3, 100);
    st.intel.strength = S.drift(st.intel.strength, target, 0.6 * dt);
    const sharing = st.diplomacy.nations.filter((n) => n.treaties.indexOf('intel') >= 0).length;
    st.intel.accuracy = S.clamp(0.22 + st.intel.strength / 150 + sharing * 0.04 -
      (st.intel.compartmented ? -0.04 : 0), 0.15, 0.96);
  };

  G.recordHistory = function (st) {
    st.history = st.history || {
      gdp: [], growth: [], inflation: [], unemployment: [], debtGdp: [], fx: [],
      market: [], approval: [], unrest: [], stability: [], prestige: [], milPower: [],
      tension: [], softPower: [], deficit: [], oil: [], labels: []
    };
    const h = st.history;
    S.pushHistory(h.gdp, S.round(st.economy.gdpReal, 1));
    S.pushHistory(h.growth, S.round(st.economy.growth, 2));
    S.pushHistory(h.inflation, S.round(st.economy.inflation, 2));
    S.pushHistory(h.unemployment, S.round(st.economy.unemployment, 2));
    S.pushHistory(h.debtGdp, S.round(st.economy.debtGdp, 1));
    S.pushHistory(h.fx, S.round(st.economy.fx, 2));
    S.pushHistory(h.market, S.round(st.economy.marketIndex, 1));
    S.pushHistory(h.approval, S.round(st.society.approval, 1));
    S.pushHistory(h.unrest, S.round(st.society.unrest, 1));
    S.pushHistory(h.stability, S.round(st.society.stability, 1));
    S.pushHistory(h.prestige, S.round(st.national.prestige, 1));
    S.pushHistory(h.softPower, S.round(st.national.softPower, 1));
    S.pushHistory(h.milPower, S.round(st.military.power, 2));
    S.pushHistory(h.tension, S.round(st.world.tension, 1));
    S.pushHistory(h.deficit, S.round((st.economy.deficit / st.economy.gdp) * 100, 2));
    S.pushHistory(h.oil, S.round(st.world.oil, 1));
    S.pushHistory(h.labels, S.MONTHS_SHORT[st.date.month] + ' ' + String(st.date.year).slice(2));
  };

  G.onNewMonth = function (st) {
    S.Dip.monthlyMoves(st);
    // The rest of the world grows too, so relative weight stays meaningful.
    st.diplomacy.nations.forEach((n) => {
      n.gdp *= 1 + (st.world.growth + (n.gdp < 2000 ? 1.4 : 0)) / 100 / 12;
    });
    if (st.date.month === 0) G.autosave();
  };

  G.onNewYear = function (st) {
    const gov = S.govMods(st);
    st.counters.yearsInOffice = (st.counters.yearsInOffice || 0) + 1;
    if (gov.elections && (st.counters.yearsInOffice + 1) % gov.elections === 0) {
      G.pushDecision('election_approaching', {});
    }
    if (gov.elections && st.counters.yearsInOffice % gov.elections === 0) {
      G.event('Election year. The country will decide whether to keep you.', '');
      S.Soc.runElection(st);
    }
    if (st.counters.yearsInOffice % 6 === 0) G.refreshRoster(st);
    // Peace tracking for the world-peace victory.
    if (st.world.tension <= 15 && !st.wars.length && (st.world.globalWars || 0) === 0) st.peaceStreak++;
    else st.peaceStreak = 0;
    G.autosave();
  };

  /* ========================================================== DECISIONS */
  /* Every world deals from its own deck. Without this, a small pool plus a
     fixed cooldown produced a near-complete rotation of the whole library
     every couple of years, identical in content across playthroughs. */
  G.ROSTER_SHARE = 0.72;

  G.buildRoster = function (st) {
    const pool = S.Decisions.LIB.filter((d) => !d.dynamic);
    const core = pool.filter((d) => d.core).map((d) => d.id);
    const rest = st.rng.shuffle(pool.filter((d) => !d.core)).map((d) => d.id);
    const keep = Math.max(12, Math.round(pool.length * G.ROSTER_SHARE) - core.length);
    st.roster = core.concat(rest.slice(0, keep));
    st.rosterOut = rest.slice(keep);
  };

  // Over a long game the roster turns over, so the back half is not the
  // same deck as the front half.
  G.refreshRoster = function (st) {
    if (!st.roster || !st.rosterOut || !st.rosterOut.length) return;
    const swaps = Math.max(1, Math.round(st.roster.length * 0.12));
    for (let i = 0; i < swaps; i++) {
      if (!st.rosterOut.length) break;
      const outIdx = st.rng.int(0, st.roster.length - 1);
      const inIdx = st.rng.int(0, st.rosterOut.length - 1);
      const leaving = st.roster[outIdx];
      const def = S.Decisions.BY_ID[leaving];
      if (def && def.core) continue;
      st.roster[outIdx] = st.rosterOut[inIdx];
      st.rosterOut[inIdx] = leaving;
    }
  };

  G.rollDecision = function (st) {
    const abs = S.absDay(st.date);
    if (!st.roster) G.buildRoster(st);
    const gaps = st.counters.decisionGap = st.counters.decisionGap || {};
    const candidates = S.Decisions.LIB.filter((d) => {
      if (d.dynamic) return false;
      if (st.roster.indexOf(d.id) < 0) return false;
      const cd = st.counters.decisionCooldown[d.id];
      // Recurrence is spaced unevenly, so nothing comes back on a metronome.
      if (cd && abs - cd < (gaps[d.id] || 1100)) return false;
      if (st.inbox.some((i) => i.def.id === d.id)) return false;
      const w = typeof d.weight === 'function' ? d.weight(st) : (d.weight || 5);
      return w > 0;
    });
    if (!candidates.length) return;
    // A per-draw jitter on top of the weight, so relevance shapes the order
    // without dictating it.
    const pick = st.rng.weighted(candidates, (d) => {
      const w = typeof d.weight === 'function' ? d.weight(st) : d.weight;
      return Math.max(0.5, w) * st.rng.range(0.45, 1.75);
    });
    if (pick) {
      gaps[pick.id] = st.rng.int(700, 1900);
      G.pushDecision(pick.id, {});
    }
  };

  G.pushDecision = function (id, ctx) {
    const st = G.state;
    const def = S.Decisions.BY_ID[id];
    if (!def) return null;
    if (st.inbox.length >= G.MAX_INBOX + 3) return null;
    // A matter concerning a state that no longer exists is not a matter.
    if (ctx && ctx.nation) {
      const cn = S.dip(st, ctx.nation);
      if (cn && cn.absorbedBy) return null;
    }
    if (st.inbox.some((i) => i.def.id === id && JSON.stringify(i.ctx) === JSON.stringify(ctx || {}))) return null;
    const item = {
      uid: S.uid('dec'), def: def, ctx: ctx || {},
      daysLeft: def.deadline || 20,
      arrived: S.dateLabel(st.date), arrivedDay: S.absDay(st.date),
      urgency: def.urgency || 'routine'
    };
    st.inbox.push(item);
    st.counters.decisionCooldown[id] = S.absDay(st.date);
    if (item.urgency === 'urgent') G.pauseForDecision();
    if (S.UI) S.UI.onNewDecision(item);
    return item;
  };

  G.availableOptions = function (st, item) {
    return item.def.options.filter((o) => !o.requires || o.requires(st));
  };

  G.resolveDecision = function (item, option) {
    const st = G.state;
    const idx = st.inbox.indexOf(item);
    if (idx >= 0) st.inbox.splice(idx, 1);
    G.applyOption(st, item, option);
  };

  G.resolveDefault = function (st, item) {
    // Inaction is a decision — the machine picks the most passive course
    // available, never one that would commit you to talks or a gamble.
    const opts = G.availableOptions(st, item);
    const weight = (o) => {
      let w = 0;
      for (const k in (o.effects || {})) w += Math.abs(o.effects[k]);
      for (const k in (o.factions || {})) w += Math.abs(o.factions[k]) * 0.5;
      if (o.risk) w += 40;
      if (o.opensNegotiation) w += 200;
      if (o.fn) w += 8;
      return w;
    };
    const option = item.def.onIgnore != null ? opts[item.def.onIgnore]
      : opts.slice().sort((a, b) => weight(a) - weight(b))[0];
    G.event('No decision was taken on "' + item.def.title + '". The default course was followed.', 'bad');
    st.society.approval -= 1.2;
    st.quality.admin -= 0.4;
    if (option) G.applyOption(st, item, option, true);
  };

  /* The numbers on an option are the ministry's estimate, not a contract.
     How close the outcome lands depends on the quality of the people who
     produced the estimate — which is one more reason to fund them. Policy
     settings and budget lines are exempt: those are levers you pull
     yourself, not results you hope for. */
  G.effectNoise = function (st) {
    const sd = 0.26 * (1 - S.clamp(st.quality.admin, 0, 100) / 170);
    return S.clamp(1 + st.rng.normal(0, sd), 0.55, 1.45);
  };

  G.applyOption = function (st, item, option, silent) {
    if (!option) return;
    const noise = G.effectNoise(st);
    // numeric effects
    if (option.effects) {
      for (const path in option.effects) {
        const isLever = path.indexOf('policy.') === 0 || path.indexOf('budget.') === 0;
        const delta = isLever ? option.effects[path] : option.effects[path] * noise;
        if (path.indexOf('budget.alloc.') === 0) {
          const key = path.split('.')[2];
          st.budget.alloc[key] = S.clamp((st.budget.alloc[key] || 0) + delta, 0, 30);
        } else if (path.indexOf('policy.') === 0) {
          const cur = S.getPath(st, path);
          if (typeof cur === 'number') S.setPath(st, path, S.clamp(cur + delta, 0, path.indexOf('tax.wealth') > 0 ? 12 : 100));
        } else {
          S.addPath(st, path, delta);
        }
      }
    }
    if (option.factions) {
      for (const fid in option.factions) {
        const f = st.factions.find((x) => x.id === fid);
        if (f) f.loyalty = S.clamp(f.loyalty + option.factions[fid] * noise, 0, 100);
      }
    }
    if (option.fn) { try { option.fn(st, item.ctx); } catch (e) { console.warn(e); } }

    let riskFired = false;
    if (option.risk && st.rng.chance(option.risk.p)) {
      riskFired = true;
      try { option.risk.fn(st, item.ctx); } catch (e) { console.warn(e); }
      G.event('Consequence: ' + option.risk.text + '.', 'bad');
    }

    // clamp the commonly-abused values
    st.society.approval = S.clamp(st.society.approval, 1, 99);
    st.society.approvalTrue = st.society.approval;
    st.society.unrest = S.clamp(st.society.unrest, 0, 100);
    st.national.prestige = S.clamp(st.national.prestige, 0, 100);
    st.intel.strength = S.clamp(st.intel.strength, 0, 100);
    st.military.readiness = S.clamp(st.military.readiness, 0, 100);

    // The record of what you decided, so later matters can refer back to it.
    st.rulings = st.rulings || {};
    st.rulings[item.def.id] = {
      i: item.def.options.indexOf(option), label: option.label,
      day: S.absDay(st.date), year: st.date.year
    };

    // Consequences that were always going to arrive later.
    if (option.then) {
      const chain = Array.isArray(option.then) ? option.then : [option.then];
      chain.forEach((t) => {
        if (t.chance != null && !st.rng.chance(t.chance)) return;
        const ctx = Object.assign({}, item.ctx, t.ctx || {});
        S.Aftermath.schedule(st, t.id, ctx, t.days || 400);
      });
    }

    if (option.headline) S.News.custom(st, option.headline, option.tone || '');
    if (!silent) {
      st.log.unshift({
        date: S.dateLabel(st.date), title: item.def.title, choice: option.label,
        cat: item.def.cat, risk: riskFired ? option.risk.text : null
      });
      if (st.log.length > 300) st.log.length = 300;
    }

    if (option.opensNegotiation) {
      const spec = option.opensNegotiation(st, item.ctx);
      if (spec) {
        S.Nego.open(st, spec.kind, spec.nation, spec.ctx);
        G.setSpeed(0);
        if (S.UI) S.UI.openNegotiation();
      }
    }
    G.resumeAfterDecision(st);
    if (S.UI) S.UI.onTick(true);
  };

  /* ============================================================= EVENTS */
  G.rollEvent = function (st) {
    const cands = S.Events.LIB.filter((e) => (typeof e.weight === 'function' ? e.weight(st) : e.weight) > 0);
    const pick = st.rng.weighted(cands, (e) => (typeof e.weight === 'function' ? e.weight(st) : e.weight));
    if (!pick) return;
    let text = null;
    try { text = pick.fire(st); } catch (e) { console.warn(e); }
    if (text) G.event(text, '');
  };

  G.event = function (text, tone) {
    const st = G.state;
    if (!st) return;
    st.log.unshift({ date: S.dateLabel(st.date), event: text, tone: tone || '' });
    if (st.log.length > 300) st.log.length = 300;
    if (S.UI) S.UI.onEvent(text, tone);
  };

  /* ==================================================== GOVERNMENT CHANGE */
  G.changeGovernment = function (st, newId) {
    if (st.nation.governmentId === newId) return;
    const old = S.gov(st);
    st.nation.governmentId = newId;
    st.nation.leaderTitle = S.LEADER_TITLES[newId] || 'Leader';
    const g = S.gov(st);
    st.society.legitimacy = S.clamp(st.society.legitimacy - 12, 0, 100);
    st.society.stability -= 6;
    st.counters.yearsInOffice = 0;
    G.event('The constitutional order has changed: from ' + old.name + ' to ' + g.name + '.', '');
    S.News.custom(st, 'A New Constitutional Order: ' + g.name + ' Proclaimed', 'major');
    st.diplomacy.nations.forEach((n) => { n.relation += (S.Dip.ideologyGap(st, n) < 30 ? 8 : -8); });
  };

  /* ========================================================== VICTORY */
  G.checkVictory = function (st) {
    if (st.ended) return;
    const vp = st.victoryProgress;
    const rank = S.Mil.worldRank(st);
    const second = rank.find((r) => !r.self);
    const milIndex = S.clamp(st.military.power / Math.max(1, rank[0].power) * 100, 0, 100);
    const lead = st.military.power - (second ? second.power : 0);
    const defeated = (st.national.warsWon || 0);

    vp.military = {
      pct: S.clamp((
        S.clamp(milIndex / 88, 0, 1) * 0.35 +
        S.clamp(lead / 20, 0, 1) * 0.25 +
        S.clamp(defeated / 3, 0, 1) * 0.25 +
        S.clamp(st.national.prestige / 75, 0, 1) * 0.15) * 100, 0, 100),
      parts: [
        { k: 'Force index vs. leader', v: S.round(milIndex, 0) + '/88', ok: milIndex >= 88 },
        { k: 'Lead over second power', v: S.round(lead, 1) + '/20', ok: lead >= 20 },
        { k: 'Rivals defeated', v: defeated + '/3', ok: defeated >= 3 },
        { k: 'Prestige', v: S.round(st.national.prestige, 0) + '/75', ok: st.national.prestige >= 75 }
      ]
    };
    const milWin = milIndex >= 88 && lead >= 20 && defeated >= 3 && st.national.prestige >= 75;

    const affine = st.diplomacy.nations.filter((n) => !n.absorbedBy && n.affinity >= 60).length;
    vp.culture = {
      pct: S.clamp((
        S.clamp(st.quality.culture / 88, 0, 1) * 0.24 +
        S.clamp(st.national.softPower / 82, 0, 1) * 0.18 +
        S.clamp(st.national.prestige / 80, 0, 1) * 0.16 +
        S.clamp(affine / 9, 0, 1) * 0.28 +
        S.clamp(st.quality.education / 78, 0, 1) * 0.14) * 100, 0, 100),
      parts: [
        { k: 'Culture index', v: S.round(st.quality.culture, 0) + '/88', ok: st.quality.culture >= 88 },
        { k: 'Soft power', v: S.round(st.national.softPower, 0) + '/82', ok: st.national.softPower >= 82 },
        { k: 'Prestige', v: S.round(st.national.prestige, 0) + '/80', ok: st.national.prestige >= 80 },
        { k: 'Nations with high affinity', v: affine + '/9', ok: affine >= 9 },
        { k: 'Education', v: S.round(st.quality.education, 0) + '/78', ok: st.quality.education >= 78 }
      ]
    };
    const cultWin = st.quality.culture >= 88 && st.national.softPower >= 82 &&
      st.national.prestige >= 80 && affine >= 9 && st.quality.education >= 78;

    const treaties = st.diplomacy.treaties.length;
    vp.peace = {
      pct: S.clamp((
        S.clamp((100 - st.world.tension) / 88, 0, 1) * 0.28 +
        S.clamp(st.peaceStreak / 5, 0, 1) * 0.32 +
        S.clamp(treaties / 10, 0, 1) * 0.25 +
        S.clamp(st.national.prestige / 72, 0, 1) * 0.15) * 100, 0, 100),
      parts: [
        { k: 'World tension', v: S.round(st.world.tension, 0) + ' (≤12)', ok: st.world.tension <= 12 },
        { k: 'Years of global peace', v: st.peaceStreak + '/5', ok: st.peaceStreak >= 5 },
        { k: 'Treaties in force', v: treaties + '/10', ok: treaties >= 10 },
        { k: 'Prestige', v: S.round(st.national.prestige, 0) + '/72', ok: st.national.prestige >= 72 }
      ]
    };
    const peaceWin = st.world.tension <= 12 && st.peaceStreak >= 5 && treaties >= 10 &&
      st.national.prestige >= 72 && !st.wars.length;

    /* Progress is as much the weakest requirement as the average of them —
       otherwise a track with one unmet condition reads as nearly won. */
    ['military', 'culture', 'peace'].forEach((k) => {
      const parts = vp[k].parts;
      const worst = parts.reduce((m, p) => Math.min(m, p.ok ? 1 : 0.34), 1);
      vp[k].pct = S.clamp(vp[k].pct * (0.45 + 0.55 * worst), 0, 100);
    });

    /* A victory has to be held, not touched. Each track must be satisfied
       continuously for three years, and nothing is decided inside a decade. */
    const streaks = st.victoryStreak = st.victoryStreak || { military: 0, culture: 0, peace: 0 };
    const met = { military: milWin, culture: cultWin, peace: peaceWin };
    const HOLD = 365 * 3;
    const MIN_YEARS = 10;
    let out = null;
    ['military', 'culture', 'peace'].forEach((k) => {
      streaks[k] = met[k] ? streaks[k] + 1 : 0;
      vp[k].holding = streaks[k];
      vp[k].parts.push({
        k: 'Held for', v: S.round(streaks[k] / 365, 1) + '/3 years',
        ok: streaks[k] >= HOLD
      });
      if (streaks[k] >= HOLD && (st.date.year - st.startYear) >= MIN_YEARS && !out) out = k;
    });
    if (out) return G.win(out);
    return null;
  };

  G.win = function (kind) {
    const st = G.state;
    if (st.ended) return;
    const v = S.VICTORY.find((x) => x.id === kind);
    st.ended = { won: true, kind: kind, name: v.name, blurb: v.blurb, date: S.dateLong(st.date) };
    G.setSpeed(0);
    if (S.UI) S.UI.showEnd();
  };

  G.lose = function (kind) {
    const st = G.state;
    if (st.ended) return;
    const d = S.DEFEATS[kind] || { name: 'The End', blurb: 'It is over.' };
    st.ended = { won: false, kind: kind, name: d.name, blurb: d.blurb, date: S.dateLong(st.date) };
    G.setSpeed(0);
    if (S.UI) S.UI.showEnd();
    return null;
  };

  /* ========================================================== SAVE/LOAD */
  G.serialise = function () {
    const st = G.state;
    if (!st) return null;
    const copy = {};
    for (const k in st) {
      if (k === 'rng' || k === 'negotiation') continue;
      copy[k] = st[k];
    }
    copy.rngState = st.rng.state();
    // decision definitions and event functions cannot be serialised
    copy.inbox = st.inbox.map((i) => ({ defId: i.def.id, ctx: i.ctx, daysLeft: i.daysLeft, arrived: i.arrived, arrivedDay: i.arrivedDay, urgency: i.urgency, uid: i.uid }));
    return JSON.stringify(copy);
  };

  G.deserialise = function (json) {
    const raw = typeof json === 'string' ? JSON.parse(json) : json;
    const st = raw;
    st.rng = S.makeRng(st.seed || 1);
    st.rng.setState(raw.rngState || st.seed || 1);
    st.inbox = (raw.inbox || []).map((i) => ({
      uid: i.uid || S.uid('dec'), def: S.Decisions.BY_ID[i.defId], ctx: i.ctx || {},
      daysLeft: i.daysLeft, arrived: i.arrived, arrivedDay: i.arrivedDay, urgency: i.urgency
    })).filter((i) => i.def);
    st.negotiation = null;
    st.speed = 0;
    // Saves written before a feature existed simply arrive without it.
    st.scars = st.scars || [];
    st.scheduled = st.scheduled || [];
    st.programmes = st.programmes || [];
    st.actionCooldown = st.actionCooldown || {};
    st.counters.decisionGap = st.counters.decisionGap || {};
    if (!st.roster) G.buildRoster(st);
    st.rulings = st.rulings || {};
    st.foreignWars = (st.foreignWars || []).map((fw) => ({
      a: fw.a, b: fw.b, started: fw.started, months: fw.months || 0,
      score: fw.score || 0, intensity: fw.intensity || 55, casA: fw.casA || 0, casB: fw.casB || 0
    }));
    st.autoPaused = false;
    st.settings = st.settings || {};
    if (st.settings.autoResume == null) st.settings.autoResume = true;
    G.state = st; S.game.state = st;
    return st;
  };

  G.autosave = function () {
    try { localStorage.setItem(G.SAVE_KEY, G.serialise()); } catch (e) { /* quota */ }
  };
  G.saveNow = function () {
    try {
      localStorage.setItem(G.SAVE_KEY, G.serialise());
      if (S.UI) S.UI.toast('Game saved.');
      return true;
    } catch (e) { if (S.UI) S.UI.toast('Save failed: ' + e.message, 'bad'); return false; }
  };
  G.hasSave = function () {
    try { return !!localStorage.getItem(G.SAVE_KEY); } catch (e) { return false; }
  };
  G.loadSave = function () {
    try {
      const raw = localStorage.getItem(G.SAVE_KEY);
      if (!raw) return null;
      return G.deserialise(raw);
    } catch (e) { console.warn(e); return null; }
  };
  G.deleteSave = function () {
    try { localStorage.removeItem(G.SAVE_KEY); } catch (e) { /* ignore */ }
  };
  G.exportSave = function () {
    const data = G.serialise();
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'strategian-' + (G.state.nation.name.replace(/\W+/g, '-').toLowerCase()) + '-' + G.state.date.year + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

})(window.S);

    { id: 'interior', name: 'Interior', icon: '⚖', group: 'Home' },

      if (!UI.dirty) return;

      UI.refreshTopbar();

      else UI.render();

  UI.onNewDecision = function (item) {

      { k: 'Growth', v: S.signedPct(st.economy.growth, 1), c: st.economy.growth > 1.5 ? 'c-good' : st.economy.growth < 0 ? 'c-bad' : '' },
      { k: 'Inflation', v: S.round(st.economy.inflation, 1) + '%', alarm: st.economy.inflation > 25, c: st.economy.inflation > 8 ? 'c-bad' : st.economy.inflation < 4 ? 'c-good' : '' },
      { k: 'Unemp.', v: S.round(st.economy.unemployment, 1) + '%', c: st.economy.unemployment > 11 ? 'c-bad' : '' },

      { k: 'Unrest', v: S.round(st.society.unrest, 0), alarm: st.society.unrest > 65, c: st.society.unrest > 50 ? 'c-bad' : '' },
      { k: 'Tension', v: S.round(st.world.tension, 0), c: st.world.tension > 60 ? 'c-bad' : '' }

      '<div class="speedctl">' +
      S.game.SPEED_NAMES.map((n, i) =>

      '</div></div>' +

  UI.toggleTheme = function () {
    // With nothing stamped the page is following the OS, so resolve what the
    // viewer is actually looking at before flipping it.
    const stamped = document.documentElement.getAttribute('data-theme');
    const effective = stamped || (window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = effective === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    if (S.game.state) S.game.state.settings.theme = next;
    try { localStorage.setItem('strategian.theme', next); } catch (e) { /* ignore */ }
  };

  /* ================================================================ NAV */
  UI.buildNav = function () {
    const nav = document.getElementById('nav');
    S.clear(nav);
    let lastGroup = null;
    UI.VIEWS.forEach((v) => {
      if (v.group !== lastGroup) {
        lastGroup = v.group;
        nav.appendChild(el('div.nav-group.caps', {}, v.group));
      }
      const btn = el('button', { data: { view: v.id }, class: UI.view === v.id ? 'on' : '' }, [
        el('span.ic', {}, v.icon), el('span', {}, v.name), el('span.badge.hidden', { data: { badge: v.id } })
      ]);
      btn.onclick = () => UI.go(v.id);
      nav.appendChild(btn);
    });
    UI.refreshNavBadges();
  };

  UI.refreshNavBadges = function () {
    const st = S.game.state; if (!st) return;
    const counts = {};
    st.inbox.forEach((i) => {
      const map = { budget: 'treasury', economy: 'economy', military: 'war', diplomacy: 'foreign', civic: 'interior', social: 'education', intel: 'intel', crisis: 'situation' };
      const v = map[i.def.cat] || 'situation';
      counts[v] = (counts[v] || 0) + 1;
    });
    S.qsa('[data-badge]').forEach((b) => {
      const n = counts[b.dataset.badge] || 0;
      b.textContent = n;
      b.classList.toggle('hidden', n === 0);
    });
  };

  UI.go = function (view) {
    UI.view = view;
    UI.pageRefresh = null;
    S.qsa('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
    UI.render();
  };

  /* =============================================================== RAIL */
  UI.buildRail = function () {
    const rail = document.getElementById('rail');
    S.clear(rail);
    const tabs = el('div.rail-tabs');
    [['news', 'Wire'], ['inbox', 'Desk'], ['log', 'Journal']].forEach(([id, label]) => {
      const b = el('button', { class: UI.railTab === id ? 'on' : '' }, label);
      b.onclick = () => { UI.railTab = id; S.qsa('.rail-tabs button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); UI.renderRail(); };
      tabs.appendChild(b);
    });
    rail.appendChild(tabs);
    rail.appendChild(el('div.rail-body#railBody'));
    UI.renderRail();
  };

  UI.renderRail = function () {
    const st = S.game.state;
    const body = document.getElementById('railBody');
    if (!body || !st) return;
    let h = '';
    if (UI.railTab === 'news') {
      if (!st.headlines.length) h = '<div class="empty">The wire is quiet.</div>';
      st.headlines.slice(0, 40).forEach((n) => {
        h += '<div class="headline ' + (n.severity === 'major' ? 'major ' : '') + esc(n.tone) + '">' +
          '<div class="outlet c-' + n.outletColor + '"><i class="dot"></i>' + esc(n.outlet) + ' · ' + esc(n.date) + '</div>' +
          '<div class="hl">' + esc(n.text) + '</div>' +
          (n.sub ? '<div class="sub">' + esc(n.sub) + '</div>' : '') + '</div>';
      });
    } else if (UI.railTab === 'inbox') {
      if (!st.inbox.length) h = '<div class="empty">Nothing awaiting your decision.</div>';
      st.inbox.forEach((i) => {
        h += '<div class="inbox-item ' + esc(i.urgency === 'urgent' ? 'urgent' : '') + '" data-inbox="' + i.uid + '">' +
          '<div class="t">' + esc(i.def.title) + '</div>' +
          '<div class="m"><span>' + esc(i.def.from || '') + '</span>' +
          '<span class="deadline">' + i.daysLeft + 'd</span></div></div>';
      });
    } else {
      if (!st.log.length) h = '<div class="empty">Nothing recorded yet.</div>';
      h += '<div class="tick-log">';
      st.log.slice(0, 60).forEach((l) => {
        h += '<div class="row"><span class="d">' + esc(l.date) + '</span><span>' +
          (l.event ? esc(l.event) : '<b>' + esc(l.title) + '</b> — ' + esc(l.choice) +
            (l.risk ? ' <span class="c-bad">(' + esc(l.risk) + ')</span>' : '')) + '</span></div>';
      });
      h += '</div>';
    }
    body.innerHTML = h;
    body.onclick = (e) => {
      const item = e.target.closest('[data-inbox]');
      if (!item) return;
      const found = st.inbox.find((i) => i.uid === item.dataset.inbox);
      if (found) UI.openDecision(found);
    };
  };

  UI.updateCrawl = function () {
    const st = S.game.state;
    const inner = document.getElementById('crawlInner');
    if (!inner || !st) return;
    if (UI._crawlDay === st.headlines.length) return;
    UI._crawlDay = st.headlines.length;
    inner.innerHTML = st.headlines.slice(0, 10).map((n) =>
      '<span><b>' + esc(n.outlet.toUpperCase()) + '</b>' + esc(n.text) + '</span>').join('');
