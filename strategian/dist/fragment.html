<title>STRATEGIAN</title>
<meta name="description" content="A long-form government management simulation: rule on the issues that reach your desk and watch them move the economy, society, armed forces and international system.">
<style>
/* ============================================================ STRATEGIAN
   A paper-and-slate palette: warm neutrals biased toward the gold accent, so
   the greys read as chosen rather than inherited.

   Themes resolve in three states. The bare :root carries the complete light
   palette. The dark palette is redefined twice — once for an un-stamped
   document on a dark OS, once for an explicit dark stamp — so that the
   in-page toggle wins in both directions. The two dark blocks are duplicates
   by necessity; edit them together.
   ==================================================================== */

:root {
  --bg:        #eceae4;
  --bg-2:      #f3f1eb;
  --panel:     #faf9f5;
  --panel-2:   #f2efe8;
  --panel-3:   #e8e4da;
  --line:      #d6d1c5;
  --line-soft: #e2ddd2;

  --ink:       #23262b;
  --ink-2:     #5b6068;
  --ink-3:     #8a8f98;

  --gold:      #9a7d33;
  --sage:      #4e7248;
  --clay:      #a2503a;
  --steel:     #4d648c;
  --plum:      #71517e;
  --teal:      #3f7a72;

  --good:      #4e7248;
  --warn:      #9a7d33;
  --bad:       #a2503a;
  --crit:      #b03d29;

  --shadow:    0 1px 2px rgba(60,50,30,.10), 0 6px 20px rgba(60,50,30,.09);
  --radius:    9px;
  --radius-sm: 6px;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0f1115;
    --bg-2:      #14171d;
    --panel:     #191d25;
    --panel-2:   #1f242e;
    --panel-3:   #262c37;
    --line:      #2b313c;
    --line-soft: #232832;

    --ink:       #e7e4dd;
    --ink-2:     #a5acb8;
    --ink-3:     #6e7683;

    --gold:      #c6a862;
    --sage:      #7fa07a;
    --clay:      #c07a63;
    --steel:     #7f96bd;
    --plum:      #9b7fa8;
    --teal:      #6fa39c;

    --good:      #7fa07a;
    --warn:      #c6a862;
    --bad:       #c07a63;
    --crit:      #d0604e;

    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  }
}

:root[data-theme="dark"] {
  --bg:        #0f1115;
  --bg-2:      #14171d;
  --panel:     #191d25;
  --panel-2:   #1f242e;
  --panel-3:   #262c37;
  --line:      #2b313c;
  --line-soft: #232832;

  --ink:       #e7e4dd;
  --ink-2:     #a5acb8;
  --ink-3:     #6e7683;

  --gold:      #c6a862;
  --sage:      #7fa07a;
  --clay:      #c07a63;
  --steel:     #7f96bd;
  --plum:      #9b7fa8;
  --teal:      #6fa39c;

  --good:      #7fa07a;
  --warn:      #c6a862;
  --bad:       #c07a63;
  --crit:      #d0604e;

  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1,h2,h3,h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: .2px; }
a { color: var(--steel); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--line); }

/* --------------------------------------------------------- colour utils */
.c-gold { color: var(--gold); }   .c-sage { color: var(--sage); }
.c-clay { color: var(--clay); }   .c-steel { color: var(--steel); }
.c-plum { color: var(--plum); }   .c-teal { color: var(--teal); }
.c-good { color: var(--good); }   .c-warn { color: var(--warn); }
.c-bad  { color: var(--bad); }    .c-crit { color: var(--crit); }
.c-mute { color: var(--ink-3); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.small { font-size: 12px; }
.tiny { font-size: 11px; letter-spacing: .4px; }
.caps { text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; color: var(--ink-3); font-weight: 600; }
.dim { color: var(--ink-2); }
.serif { font-family: var(--serif); }
.tr.up { color: var(--good); } .tr.dn { color: var(--bad); } .tr.fl { color: var(--ink-3); }
.tr { font-size: 9px; vertical-align: middle; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }

/* ================================================================ SHELL */
#app { height: 100vh; display: flex; flex-direction: column; }

.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  height: 54px; padding: 0 14px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border-bottom: 1px solid var(--line);
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: 14px; border-right: 1px solid var(--line); }
.brand .crest {
  width: 30px; height: 30px; border-radius: 5px; display: grid; place-items: center;
  background: linear-gradient(160deg, var(--gold), var(--clay)); color: #14171d;
  font-family: var(--serif); font-weight: 700; font-size: 15px;
}
.brand .name { font-family: var(--serif); font-size: 16px; line-height: 1.1; }
.brand .sub { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }

.clockbox { display: flex; align-items: center; gap: 10px; }
.clock { font-family: var(--mono); font-size: 13px; color: var(--ink); min-width: 118px; }
.speedctl { display: flex; gap: 2px; background: var(--bg-2); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--line-soft); }
.speedctl button {
  background: transparent; border: 0; color: var(--ink-3); cursor: pointer;
  padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: var(--mono);
}
.speedctl button:hover { color: var(--ink); background: var(--panel-3); }
.speedctl button.on { background: var(--gold); color: #14171d; font-weight: 700; }
.speedctl button.pause.on { background: var(--clay); color: #fff; }

.stat-strip { display: flex; gap: 4px; flex: 1 1 auto; overflow: hidden; min-width: 0; }
.stat-chip {
  display: flex; flex-direction: column; justify-content: center;
  padding: 4px 9px; border-radius: var(--radius-sm);
  flex: 1 1 auto; min-width: 0;
  background: var(--bg-2); border: 1px solid var(--line-soft);
}
.stat-chip .k, .stat-chip .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* On narrower screens the least urgent readouts step aside. */
@media (max-width: 1560px) { .stat-chip:nth-child(n+9) { display: none; } }
@media (max-width: 1360px) { .stat-chip:nth-child(n+7) { display: none; } }
@media (max-width: 1180px) { .stat-chip:nth-child(n+5) { display: none; } }
.stat-chip .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.stat-chip .v { font-family: var(--mono); font-size: 13px; line-height: 1.25; }
.stat-chip.alarm { border-color: var(--crit); box-shadow: 0 0 0 1px rgba(208,96,78,.25) inset; }

.topbtns { display: flex; gap: 6px; }
.iconbtn {
  background: var(--bg-2); border: 1px solid var(--line-soft); color: var(--ink-2);
  border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; font-size: 12px;
}
.iconbtn:hover { color: var(--ink); border-color: var(--line); background: var(--panel-3); }

/* ------------------------------------------------------------- layout */
.body-grid { flex: 1 1 auto; display: grid; grid-template-columns: 210px 1fr 320px; min-height: 0; }
.body-grid.rail-collapsed { grid-template-columns: 210px 1fr 0px; }

.nav {
  background: var(--bg-2); border-right: 1px solid var(--line);
  padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
}
.nav-group { margin: 10px 0 4px; padding: 0 8px; }
.nav button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: transparent; border: 0; color: var(--ink-2); cursor: pointer;
  padding: 7px 9px; border-radius: var(--radius-sm); font-size: 13px; position: relative;
}
.nav button:hover { background: var(--panel); color: var(--ink); }
.nav button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--gold); }
.nav button .ic { width: 16px; text-align: center; opacity: .85; font-size: 13px; }
.nav .badge {
  margin-left: auto; background: var(--clay); color: #fff; font-size: 10px; font-weight: 700;
  border-radius: 9px; padding: 0 6px; min-width: 17px; text-align: center;
}
.nav .badge.quiet { background: var(--panel-3); color: var(--ink-2); }

.main { overflow-y: auto; padding: 18px 22px 60px; min-width: 0; }
.rail { background: var(--bg-2); border-left: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.rail-collapsed .rail { display: none; }

/* ------------------------------------------------------------- panels */
.page-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.page-head h1 { font-size: 24px; }
.page-head .lede { color: var(--ink-2); font-size: 13px; max-width: 620px; }
.page-head .spacer { flex: 1; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }
@media (max-width: 1500px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 1250px) { .g3, .g-2-1, .g-1-2 { grid-template-columns: 1fr; } }

.card {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: 14px 16px; min-width: 0;
}
.card.tight { padding: 10px 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-h h3 { font-size: 14.5px; }
.card-h .spacer { flex: 1; }
.card-h .hint { font-size: 11px; color: var(--ink-3); }
.card.accent-gold { border-left: 2px solid var(--gold); }
.card.accent-clay { border-left: 2px solid var(--clay); }
.card.accent-sage { border-left: 2px solid var(--sage); }
.card.accent-steel { border-left: 2px solid var(--steel); }

.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.kpi .v { font-family: var(--mono); font-size: 22px; line-height: 1.2; }
.kpi .d { font-size: 11.5px; color: var(--ink-2); }
.kpi-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }

/* tables */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--panel-2); }
table.data td.num, table.data th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* meters + bars */
.meter { display: inline-block; width: 100%; max-width: 130px; height: 6px; background: var(--panel-3); border-radius: 4px; overflow: hidden; vertical-align: middle; }
.meter i { display: block; height: 100%; border-radius: 4px; background: currentColor; }
.barrow { display: grid; grid-template-columns: minmax(96px, 1.35fr) 1.4fr auto; gap: 10px; align-items: center; padding: 3px 0; font-size: 12.5px; }
.barrow-l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow-t { height: 7px; background: var(--panel-3); border-radius: 4px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: currentColor; border-radius: 4px; }
.barrow-v { font-family: var(--mono); font-size: 12px; min-width: 52px; text-align: right; }
.dbar { position: relative; display: inline-block; width: 100%; max-width: 140px; height: 7px; background: var(--panel-3); border-radius: 4px; vertical-align: middle; }
.dbar-mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.dbar-fill { position: absolute; top: 0; height: 100%; background: currentColor; border-radius: 3px; }

/* charts */
.chart { position: relative; }
.chart-svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line-soft); stroke-width: 1; }
.chart .zeroline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.chart text.axis { fill: var(--ink-3); font-size: 9.5px; font-family: var(--mono); }
.chart .line { stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: currentColor; opacity: .10; stroke: none; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; font-size: 11px; color: var(--ink-2); }
.chart-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.chart-legend .lg i { width: 9px; height: 2.5px; border-radius: 2px; background: currentColor; }
.chart-empty { color: var(--ink-3); font-size: 12px; padding: 20px; text-align: center; }
.spark { vertical-align: middle; }
.spark-good { color: var(--good); } .spark-bad { color: var(--bad); }

/* ------------------------------------------------------------ controls */
.field { margin-bottom: 14px; }
.field-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.field-h label { font-size: 12.5px; color: var(--ink); }
.field-h .val { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--gold); }
.field .desc { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.45; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--panel-3); border-radius: 3px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--panel-3); border-radius: 3px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold); border: 2px solid var(--panel); margin-top: -5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); border: 2px solid var(--panel); }
input[type=range]:disabled::-webkit-slider-thumb { background: var(--ink-3); }

input[type=text], input[type=number], select, textarea {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 9px; width: 100%; outline: none;
}
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--gold); }
label.check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; padding: 3px 0; }
input[type=checkbox] { accent-color: var(--gold); width: 15px; height: 15px; }

.btn {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--panel-3); border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #14171d; font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { background: transparent; border-color: var(--clay); color: var(--clay); }
.btn.danger:hover:not(:disabled) { background: rgba(192,122,99,.12); }
.btn.ghost { background: transparent; border-color: var(--line-soft); color: var(--ink-2); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; color: var(--ink-3); padding: 5px 11px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--panel-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.tag {
  display: inline-block; padding: 1.5px 7px; border-radius: 20px; font-size: 10.5px;
  border: 1px solid currentColor; opacity: .95; letter-spacing: .03em; white-space: nowrap;
}
.tag.solid { color: #14171d; border-color: transparent; }
.tag.solid.c-gold { background: var(--gold); }
.tag.solid.c-clay { background: var(--clay); color: #fff; }
.tag.solid.c-sage { background: var(--sage); }
.tag.solid.c-steel { background: var(--steel); }

.pill-row { display: flex; gap: 6px; flex-wrap: wrap; }

.notice { padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12.5px; border: 1px solid var(--line); background: var(--panel-2); }
.notice.warn { border-color: rgba(198,168,98,.5); background: rgba(198,168,98,.08); }
.notice.bad  { border-color: rgba(192,122,99,.5); background: rgba(192,122,99,.09); }
.notice.good { border-color: rgba(127,160,122,.5); background: rgba(127,160,122,.08); }

.empty { color: var(--ink-3); font-size: 12.5px; padding: 26px 10px; text-align: center; font-style: italic; }

/* =============================================================== RAIL */
.rail-tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.rail-tabs button {
  flex: 1; background: transparent; border: 0; color: var(--ink-3); padding: 9px 4px;
  cursor: pointer; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border-bottom: 2px solid transparent;
}
.rail-tabs button.on { color: var(--ink); border-bottom-color: var(--gold); }
.rail-body { flex: 1 1 auto; overflow-y: auto; padding: 10px; }

.headline {
  padding: 9px 10px; border-radius: var(--radius-sm); background: var(--panel);
  border: 1px solid var(--line-soft); margin-bottom: 7px; animation: slidein .35s ease;
}
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.headline .outlet { font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.headline .outlet .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.headline .hl { font-family: var(--serif); font-size: 13.5px; line-height: 1.35; margin-top: 3px; }
.headline .sub { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
.headline.major { border-color: var(--gold); }
.headline.bad { border-left: 2px solid var(--clay); }
.headline.good { border-left: 2px solid var(--sage); }

.inbox-item {
  padding: 10px 11px; border-radius: var(--radius-sm); background: var(--panel);
  border: 1px solid var(--line-soft); margin-bottom: 8px; cursor: pointer;
  border-left: 2px solid var(--gold);
}
.inbox-item:hover { background: var(--panel-2); }
.inbox-item .t { font-size: 13px; font-family: var(--serif); line-height: 1.3; }
.inbox-item .m { display: flex; gap: 8px; align-items: center; font-size: 10.5px; color: var(--ink-3); margin-top: 5px; }
.inbox-item.urgent { border-left-color: var(--crit); }
.inbox-item.crisis { border-left-color: var(--crit); background: rgba(208,96,78,.06); }

.tick-log { font-size: 11.5px; color: var(--ink-2); }
.tick-log .row { padding: 5px 2px; border-bottom: 1px solid var(--line-soft); display: flex; gap: 8px; }
.tick-log .row .d { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; flex: 0 0 62px; }

/* ============================================================== MODALS */
.overlay {
  position: fixed; inset: 0; background: rgba(8,10,13,.72); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); width: min(760px, 100%); max-height: 90vh; overflow: hidden;
  display: flex; flex-direction: column;
}
.modal.wide { width: min(1100px, 100%); }
.modal-h { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.modal-h .eyebrow { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }

<script>
/* ==== js/util.js ==== */
/* STRATEGIAN — utilities: RNG, math, formatting, DOM, charts */
window.S = window.S || {};
(function (S) {
  'use strict';

  /* ---------------------------------------------------------------- RNG -- */
  // mulberry32 — deterministic, serialisable in a save file.
  S.makeRng = function (seed) {
    let a = seed >>> 0;
    const rng = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.state = () => a >>> 0;
    rng.setState = (s) => { a = s >>> 0; };
    rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
    rng.range = (lo, hi) => lo + rng() * (hi - lo);
    // Approximately normal via sum of uniforms (Irwin–Hall, n=3).
    rng.normal = (mean, sd) => {
      const u = rng() + rng() + rng() - 1.5;
      return mean + u * sd * 1.4142;
    };
    rng.chance = (p) => rng() < p;
    rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
    rng.shuffle = (arr) => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a2[i], a2[j]] = [a2[j], a2[i]];
      }
      return a2;
    };
    rng.weighted = (items, weightOf) => {
      let total = 0;
      for (const it of items) total += Math.max(0, weightOf(it));
      if (total <= 0) return null;
      let r = rng() * total;
      for (const it of items) {
        r -= Math.max(0, weightOf(it));
        if (r <= 0) return it;
      }
      return items[items.length - 1];
    };
    return rng;
  };

  /* --------------------------------------------------------------- math -- */
  S.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  S.lerp = (a, b, t) => a + (b - a) * t;
  S.inv = (v) => 100 - v;
  // Pulls a value toward a target by a fraction — the workhorse of the sim.
  S.drift = (v, target, rate) => v + (target - v) * rate;
  S.round = (v, d) => { const m = Math.pow(10, d || 0); return Math.round(v * m) / m; };
  S.sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
  S.avg = (arr, f) => (arr.length ? S.sum(arr, f) / arr.length : 0);
  // Smooth 0..1 response curve; used for saturating effects (diminishing returns).
  S.sat = (x, half) => x / (x + half);
  S.mean = S.avg;

  /* --------------------------------------------------------- formatting -- */
  S.fmtScaled = function (v, sym) {
    sym = sym == null ? '' : sym;
    const n = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (n >= 1e6) return sign + sym + (n / 1e6).toFixed(2) + 'Qa';
    if (n >= 1e3) return sign + sym + (n / 1e3).toFixed(2) + 'T';
    if (n >= 1) return sign + sym + n.toFixed(n >= 100 ? 0 : 1) + 'B';
    return sign + sym + (n * 1000).toFixed(0) + 'M';
  };
  // Money values in the sim are stored in billions of the national unit.
  S.money = function (v) {
    const st = S.game && S.game.state;
    const sym = st ? st.economy.currencySymbol : '$';
    return S.fmtScaled(v, sym);
  };
  S.pct = (v, d) => (v >= 0 ? '' : '') + (v).toFixed(d == null ? 1 : d) + '%';
  S.signed = (v, d) => (v > 0 ? '+' : '') + v.toFixed(d == null ? 1 : d);
  S.signedPct = (v, d) => (v > 0 ? '+' : '') + v.toFixed(d == null ? 1 : d) + '%';
  S.num = function (v, d) {
    return Number(v).toLocaleString('en-US', {
      minimumFractionDigits: d || 0, maximumFractionDigits: d || 0
    });
  };
  // Compact form for tables and cards. `v` is in millions throughout.
  S.people = function (v) {
    const n = Math.abs(v);
    if (n >= 1000) return (v / 1000).toFixed(2) + 'bn';
    if (n >= 1) return v.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + 'm';
    if (n >= 0.001) return S.num(Math.round(v * 1e6 / 1000)) + 'k';
    return S.num(Math.round(v * 1e6));
  };

  // Long form for prose — briefings and briefs read as sentences, so they get
  // "2.94 million" rather than "2938 thousand".
  S.headcount = function (v) { // v in millions
    const n = Math.abs(v);
    if (n >= 1000) return (v / 1000).toFixed(2) + ' billion';
    if (n >= 1) return v.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + ' million';
    if (n >= 0.0005) return S.num(Math.round(v * 1e6 / 1000) * 1000);

  };
  S.ordinal = function (n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  /* ------------------------------------------------------------- dates -- */
  S.MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  S.MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  S.DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  S.dateLabel = function (d) {
    return S.MONTHS_SHORT[d.month] + ' ' + d.day + ', ' + d.year;
  };
  S.dateLong = function (d) {
    return S.MONTHS[d.month] + ' ' + S.ordinal(d.day) + ', ' + d.year;
  };
  // Absolute day index — used for deadlines and elapsed-time maths.
  S.absDay = function (d) { return d.year * 365 + d.dayOfYear; };

  /* ---------------------------------------------------------------- DOM -- */
  S.el = function (tag, attrs, children) {
    const parts = tag.split(/([#.])/);
    const node = document.createElement(parts[0] || 'div');
    for (let i = 1; i < parts.length; i += 2) {
      if (parts[i] === '#') node.id = parts[i + 1];
      else node.classList.add(parts[i + 1]);
    }
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') node.className += (node.className ? ' ' : '') + v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'data' && typeof v === 'object') {

    return node;

  S.append = function (node, children) {
    if (children == null || children === false) return node;
    if (Array.isArray(children)) { children.forEach((c) => S.append(node, c)); return node; }

  S.getPath = function (obj, path) {

    let cur = obj;

  S.setPath = function (obj, path, value) {
    const keys = path.split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) {

      cur = cur[keys[i]];

    cur[keys[keys.length - 1]] = value;

    const cur = S.getPath(obj, path);

  /* -------------------------------------------------------------- ring -- */
  // Fixed-length history buffer for charts.
  S.pushHistory = function (arr, value, cap) {
    arr.push(value);
    if (arr.length > (cap || 240)) arr.splice(0, arr.length - (cap || 240));

  };

  /* ------------------------------------------------------------ charts -- */
  function pathFrom(values, w, h, pad, min, max) {
    if (!values.length) return '';
    const span = (max - min) || 1;
    const n = values.length;
    const dx = n > 1 ? (w - pad * 2) / (n - 1) : 0;
    let d = '';
    for (let i = 0; i < n; i++) {
      const x = pad + i * dx;
      const y = h - pad - ((values[i] - min) / span) * (h - pad * 2);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    return d.trim();
  }

  S.sparkline = function (values, opts) {
    opts = opts || {};
    const w = opts.w || 120, h = opts.h || 30, pad = 2;
    if (!values || values.length < 2) return '<svg class="spark" width="' + w + '" height="' + h + '"></svg>';
    const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    const d = pathFrom(values, w, h, pad, min, max);
    const up = values[values.length - 1] >= values[0];
    const cls = opts.color || (opts.invert ? (up ? 'bad' : 'good') : (up ? 'good' : 'bad'));
    const last = values[values.length - 1];
    const span = (max - min) || 1;
    const cy = h - pad - ((last - min) / span) * (h - pad * 2);
    const cx = w - pad;
    return '<svg class="spark spark-' + cls + '" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +

      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="1.9" fill="currentColor"/></svg>';
  };

  // Multi-series line chart with axes and a light grid.
  S.lineChart = function (series, opts) {
    opts = opts || {};
    const w = opts.w || 620, h = opts.h || 200, padL = 46, padR = 12, padT = 12, padB = 22;
    const all = [];
    series.forEach((s) => { all.push.apply(all, s.values); });
    if (!all.length) return '<div class="chart-empty">No data yet.</div>';
    let min = opts.min != null ? opts.min : Math.min.apply(null, all);
    let max = opts.max != null ? opts.max : Math.max.apply(null, all);
    if (opts.zero) min = Math.min(min, 0);
    if (max - min < 1e-6) { max = min + 1; }
    const padSpan = (max - min) * 0.1;
    min -= padSpan; max += padSpan;

    const xOf = (i, n) => padL + (n > 1 ? (i / (n - 1)) * innerW : innerW / 2);
    const yOf = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;

    let g = '';
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const v = min + (max - min) * (t / ticks);
      const y = yOf(v);
      g += '<line class="grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="axis" x="' + (padL - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        (opts.fmt ? opts.fmt(v) : S.round(v, Math.abs(max) < 10 ? 1 : 0)) + '</text>';
    }
    if (min < 0 && max > 0) {
      g += '<line class="zeroline" x1="' + padL + '" y1="' + yOf(0).toFixed(1) + '" x2="' + (w - padR) + '" y2="' + yOf(0).toFixed(1) + '"/>';
    }
    let lines = '';
    series.forEach((s) => {
      const n = s.values.length;
      let d = '';
      for (let i = 0; i < n; i++) {
        d += (i ? 'L' : 'M') + xOf(i, n).toFixed(1) + ' ' + yOf(s.values[i]).toFixed(1) + ' ';
      }
      if (s.fill) {
        const area = d + 'L' + xOf(n - 1, n).toFixed(1) + ' ' + yOf(Math.max(min, 0)).toFixed(1) +
          ' L' + xOf(0, n).toFixed(1) + ' ' + yOf(Math.max(min, 0)).toFixed(1) + ' Z';
        lines += '<path class="area c-' + (s.color || 'gold') + '" d="' + area + '"/>';
      }
      lines += '<path class="line c-' + (s.color || 'gold') + '" d="' + d.trim() + '" fill="none"' +
        (s.dash ? ' stroke-dasharray="4 3"' : '') + '/>';
    });
    let legend = '';
    if (series.length > 1 || opts.legend) {
      legend = '<div class="chart-legend">' + series.map((s) =>
        '<span class="lg c-' + (s.color || 'gold') + '"><i></i>' + S.esc(s.label || '') + '</span>').join('') + '</div>';
    }
    let xl = '';
    if (opts.xLabels && opts.xLabels.length) {
      const n = series[0].values.length;
      opts.xLabels.forEach((lb) => {
        xl += '<text class="axis" x="' + xOf(lb.i, n).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle">' + S.esc(lb.t) + '</text>';
      });
    }
    // No preserveAspectRatio override: stretching the viewBox would distort
    // the axis type along with the plot.
    return '<div class="chart">' + legend +
      '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart-svg">' +
      g + lines + xl + '</svg></div>';
  };

  S.barRow = function (label, value, max, color, valueText) {
    const p = S.clamp((value / (max || 100)) * 100, 0, 100);
    return '<div class="barrow"><span class="barrow-l">' + S.esc(label) + '</span>' +
      '<span class="barrow-t"><i class="bar-fill c-' + (color || 'gold') + '" style="width:' + p.toFixed(1) + '%"></i></span>' +
      '<span class="barrow-v">' + S.esc(valueText != null ? valueText : S.round(value, 1)) + '</span></div>';
  };

  // Horizontal diverging bar for -100..100 scales (relations, war score).
  S.divergeBar = function (value, opts) {
    opts = opts || {};
    const v = S.clamp(value, -100, 100);
    const half = Math.abs(v) / 2; // percent of full width
    const cls = v >= 0 ? (opts.invert ? 'bad' : 'good') : (opts.invert ? 'good' : 'bad');
    const left = v >= 0 ? 50 : 50 - half;
    return '<span class="dbar"><i class="dbar-mid"></i>' +
      '<i class="dbar-fill c-' + cls + '" style="left:' + left + '%;width:' + half + '%"></i></span>';
  };

  S.meter = function (value, opts) {
    opts = opts || {};
    const v = S.clamp(value, 0, 100);
    let cls = opts.color;
    if (!cls) {
      const good = opts.invert ? v < 35 : v > 65;
      const bad = opts.invert ? v > 65 : v < 35;
      cls = good ? 'good' : bad ? 'bad' : 'warn';
    }
    return '<span class="meter"><i class="c-' + cls + '" style="width:' + v.toFixed(1) + '%"></i></span>';
  };

  /* --------------------------------------------------------- misc utils -- */
  S.trendOf = function (arr, look) {
    if (!arr || arr.length < 2) return 0;
    const n = Math.min(look || 12, arr.length);
    return arr[arr.length - 1] - arr[arr.length - n];
  };
  S.arrow = function (delta, eps) {
    const e = eps == null ? 0.05 : eps;
    if (delta > e) return '<span class="tr up">▲</span>';
    if (delta < -e) return '<span class="tr dn">▼</span>';
    return '<span class="tr fl">—</span>';
  };
  S.rateWord = function (v, words) {
    // words: ascending list of 5 labels for 0-20,20-40,40-60,60-80,80-100
    return words[S.clamp(Math.floor(v / 20), 0, 4)];
  };

    return (prefix || 'id') + '_' + S._uidN.toString(36);
  };

    authoritarian: { liberal: 80, democratic: 70, managed: 28, party: 22, authoritarian: 0, monarchy: 25, populist: 35, mixed: 40 },
    monarchy: { liberal: 55, democratic: 50, managed: 30, party: 45, authoritarian: 25, monarchy: 0, populist: 50, mixed: 35 },
    populist: { liberal: 45, democratic: 30, managed: 30, party: 40, authoritarian: 35, monarchy: 50, populist: 0, mixed: 30 },

        (reason === 'mediated' ? 'Brokered by our delegation. ' : '') + fw.months + ' months of war, ' + dead + ' dead, no decisive result.');

  Nego.counterOffer = function (nego, playerOffer) {

    }

  };

  Nego.targetUtility = function (nego) {

  /* ================================================= LEVERAGE ACTIONS */
  Nego.ACTIONS = [
    {
      id: 'intel', name: 'Table Intelligence',
      desc: 'Reveal what our services know about their instructions and their real constraints.',
      can: (st) => st.intel.strength > 35,
      cost: (st) => 'Burns a source · Intel −4',
      run: (st, nego) => {
        st.intel.strength -= 4;
        nego.softening += 0.05 + (st.intel.strength / 1000);
        nego.revealLevel = Math.min(2, nego.revealLevel + 1);
        return 'Our delegation set a folder on the table and said nothing. Their principal read two pages and asked for a recess.';
      }
    },
    {
      id: 'threat', name: 'Threaten Escalation',
      desc: 'Make the alternative to agreement explicitly worse for them.',
      can: (st) => st.military.power > 5,
      cost: () => 'World tension +4 · Relations −6 · May backfire',
      run: (st, nego) => {
        const n = S.dip(st, nego.nationId);
        st.world.tension += 4;
        if (n) n.relation -= 6;
        const credible = nego.leverageOurs > 52;
        if (credible) {
          nego.softening += 0.09; nego.trust -= 8;
          return 'The threat landed. Their delegation stopped taking notes and started taking it seriously.';
        }
        nego.softening -= 0.05; nego.trust -= 14; nego.patience -= 1;
        if (n) n.grievance = (n.grievance || 0) + 8;
        return 'The threat did not land. They know what we can actually do, and they let the silence say so.';
      }
    },
    {
      id: 'sweeten', name: 'Offer a Side Payment',
      desc: 'Money, credit lines or a quiet favour outside the formal text.',
      can: (st) => st.economy.reserves > st.economy.gdp * 0.005,
      cost: (st) => 'Costs ' + S.money(st.economy.gdp * 0.012) + ' from reserves',
      run: (st, nego) => {
        st.economy.reserves -= st.economy.gdp * 0.012;
        nego.softening += 0.075; nego.trust += 5;
        return 'A separate letter, not for publication, was initialled at the side table.';
      }
    },
    {
      id: 'public', name: 'Go Public',
      desc: 'Take the position to the world\'s press and put their government on the defensive.',
      can: (st) => st.national.softPower > 25,
      cost: () => 'Approval ±, prestige at risk, hardens their position if it fails',
      run: (st, nego) => {
        const good = st.national.softPower > 50 && st.national.prestige > 45;
        if (good) {
          nego.softening += 0.06; st.society.approval += 2;
          nego.patience -= 1;
          return 'The story ran everywhere. Their capital woke up to editorials asking why they are being unreasonable.';
        }
        nego.softening -= 0.04; nego.trust -= 10; st.society.approval -= 1;
        return 'The story ran and nobody picked it up. Their negotiator thanked us for the free publicity.';
      }
    },
    {
      id: 'walkthreat', name: 'Signal Willingness to Walk',
      desc: 'Instruct the delegation to book flights home, loudly.',
      can: () => true,
      cost: () => 'Their patience −2 · High risk of collapse',
      run: (st, nego) => {
        nego.patience -= 2;
        if (nego.leverageOurs > 55) {
          nego.softening += 0.10;
          return 'Our team began packing. Within the hour their principal requested an unscheduled meeting.';
        }
        nego.softening -= 0.03;
        return 'Our team began packing. They wished us a safe journey and ordered coffee.';
      }
    },
    {
      id: 'concede', name: 'Make a Goodwill Gesture',
      desc: 'Move first on a secondary issue to unstick the room.',
      can: () => true,
      cost: () => 'Gives ground on your lowest-priority issue',
      run: (st, nego) => {
        const i = nego.issues.slice().sort((a, b) => a.weightYou - b.weightYou)[0];
        nego.offer[i.id] = Math.max(0, nego.offer[i.id] - 18);
        nego.trust += 10; nego.softening += 0.03;
        return 'We moved on ' + i.label.toLowerCase() + ' without being asked. The temperature in the room dropped a degree.';
      }
    }
  ];

  /* ============================================================== OPEN */
  Nego.open = function (st, kind, nationId, ctx) {
    const n = S.dip(st, nationId);
    const personality = n ? n.personality : 'strategic';
    const p = Nego.PERSONALITIES[personality];
    const nego = {
      id: S.uid('nego'), kind: kind, nationId: nationId, ctx: ctx || {},
      personality: personality,
      issues: Nego.buildIssues(st, kind, n, ctx),
      round: 0, maxRounds: p.patience + 2, patience: p.patience,
      softening: 0, trust: n ? S.clamp(50 + n.relation * 0.35, 5, 95) : 50,
      revealLevel: 0, lastPlayerConcession: 0,
      transcript: [], status: 'open', rng: st.rng,
      usedActions: []
    };
    Nego.computeLeverage(st, nego);
    nego.theirOffer = {};
    nego.issues.forEach((i) => { nego.theirOffer[i.id] = Math.max(0, Math.round(100 - i.redline - 10)); });
    nego.offer = {};
    nego.issues.forEach((i) => { nego.offer[i.id] = 72; });
    nego.transcript.push({ who: 'sys', text: Nego.openingLine(st, nego) });
    nego.transcript.push({ who: 'them', text: Nego.theirStatement(st, nego, 'open') });
    st.negotiation = nego;
    return nego;
  };

  Nego.title = function (st, nego) {
    const n = S.dip(st, nego.nationId);
    const who = n ? n.name : 'the counterparty';
    return ({
      peace: 'Peace Talks — ' + who, trade: 'Trade Negotiation — ' + who,
      alliance: 'Alliance Talks — ' + who, ultimatum: 'Crisis Talks — ' + who,
      arms: 'Arms Control — ' + who, resource: 'Energy Contract — ' + who
    })[nego.kind] || ('Negotiation — ' + who);
  };

  Nego.openingLine = function (st, nego) {
    const n = S.dip(st, nego.nationId);
    const place = st.rng.pick(['a neutral capital', 'the old customs house', 'a lakeside hotel',
      'the foreign ministry annexe', 'a converted monastery', 'an airport hotel nobody chose']);
    return 'Talks convened in ' + place + '. ' + (n ? n.name : 'The delegation') +
      ' is represented by a delegation with ' +
      (nego.leverageTheirs > 58 ? 'visibly little urgency' : nego.leverageTheirs < 42 ?
        'instructions to come home with something' : 'a narrow mandate') + '.';
  };

  /* --------------------------------------------------- generated speech */
  Nego.theirStatement = function (st, nego, phase, offer) {
    const n = S.dip(st, nego.nationId);
    const p = Nego.PERSONALITIES[nego.personality];
    const rng = st.rng;
    // Which issue is furthest from their position?
    let worst = null, worstGap = -1;
    nego.issues.forEach((i) => {
      const gap = ((offer ? offer[i.id] : nego.offer[i.id]) - (100 - i.redline)) * i.weightThem;
      if (gap > worstGap) { worstGap = gap; worst = i; }
    });
    const lev = nego.leverageTheirs;

    if (phase === 'open') {
      const tone = {
        blunt: 'We will save everyone time. Our requirements are not a starting position.',
        procedural: 'We are here in good faith and within a mandate. Let us begin with the text.',
        measured: 'We have studied your situation carefully. We think there is an agreement here, at a price.',
        even: 'We are not aligned with anyone in this room. Convince us on the merits.',
        careful: 'Our instructions are cautious. We would rather leave with nothing than with a bad text.',
        commercial: 'Let us treat this as what it is — a transaction. What are you actually buying?',
        sly: 'Circumstances have been kind to us lately. We are happy to wait for them to be kinder.',
        heated: 'You will forgive us if we do not pretend this is a normal negotiation.',
        earnest: 'There is a settlement here that both our peoples could live with. Let us find it.'
      }[p.tone];
      return tone;
    }
    if (phase === 'accept') {
      return rng.pick([
        'We can live with this. Our principals will initial the text tonight.',
        'Agreed. We will need a week for ratification, but the substance is settled.',
        'This is acceptable. It is not what we wanted, which is usually the sign of a real agreement.',
        'Done. Let us both go home and describe this as a victory.'
      ]);
    }
    if (phase === 'collapse') {
      return rng.pick([
        'There is nothing further to discuss. Our delegation is leaving tonight.',
        'You have wasted our time and, more importantly, our patience. We are done.',
        'We will inform our government that talks failed and that the fault is yours.',
        'This process is over. What happens next is no longer a negotiation.'
      ]);
    }
    // Counter-offer commentary.
    const parts = [];
    if (worst && worstGap > 0) {
      parts.push(rng.pick([
        'Your position on ' + worst.label.toLowerCase() + ' is not something we can carry home.',
        'We cannot move further on ' + worst.label.toLowerCase() + '. That is a mandate limit, not a tactic.',
        'Strike ' + worst.label.toLowerCase() + ' from your expectations and we can make progress.',
        'On ' + worst.label.toLowerCase() + ', you are asking us to do something our own parliament would not survive.'
      ]));
    }
    if (lev > 62) {
      parts.push(rng.pick([
        'We are not the party under time pressure here.',
        'Our position improves with every week this takes. Yours does not.',
        'We have alternatives. We have read the reports on yours.'
      ]));
    } else if (lev < 40) {
      parts.push(rng.pick([
        'We would rather not test what happens if this fails.',
        'There is a version of this we can accept. Help us find it quickly.',
        'Our instructions have become more flexible since we arrived.'
      ]));
    }
    if (nego.revealLevel > 0 && rng.chance(0.5)) {
      parts.push('You appear to be unusually well briefed. We will adjust accordingly.');
    }
    if (st.wars.some((w) => w.enemyId === nego.nationId && w.score < -20) && rng.chance(0.6)) {
      parts.push('Every day this continues, the map improves for us.');
    }
    if (!parts.length) parts.push('Here is our revised text. We have moved where we can.');
    return parts.join(' ');
  };

  /* ------------------------------------------------------ player action */
  Nego.submit = function (st, nego) {
    if (nego.status !== 'open') return;
    // Track concession size for reciprocal personalities.
    if (nego.prevOffer) {
      let conceded = 0;
      nego.issues.forEach((i) => { conceded += Math.max(0, nego.prevOffer[i.id] - nego.offer[i.id]); });
      nego.lastPlayerConcession = conceded / nego.issues.length;
    }
    nego.prevOffer = Object.assign({}, nego.offer);
    nego.round++;
    Nego.computeLeverage(st, nego);

    nego.transcript.push({ who: 'you', text: Nego.describeOffer(nego, nego.offer) });

    const chance = Nego.acceptChance(nego, nego.offer);
    if (st.rng.chance(chance)) {
      nego.status = 'accepted';
      nego.transcript.push({ who: 'them', text: Nego.theirStatement(st, nego, 'accept') });
      return 'accepted';
    }

    nego.patience -= 1;
    const p = Nego.PERSONALITIES[nego.personality];
    const insulting = Nego.theirUtility(nego, nego.offer) < Nego.reservation(nego) - 0.3;
    if (insulting && st.rng.chance(p.walk)) nego.patience -= 1;

    if (nego.patience <= 0 || nego.round >= nego.maxRounds) {
      nego.status = 'collapsed';
      nego.transcript.push({ who: 'them', text: Nego.theirStatement(st, nego, 'collapse') });
      return 'collapsed';
    }

    nego.theirOffer = Nego.counterOffer(nego, nego.offer);
    nego.transcript.push({ who: 'them', text: Nego.theirStatement(st, nego, 'counter', nego.offer) });
    nego.transcript.push({ who: 'sys', text: 'They tabled a revised text.' });
    return 'continue';
  };

  Nego.describeOffer = function (nego, offer) {
    const bits = nego.issues.map((i) => i.label + ': ' + i.fmt(offer[i.id]));
    return 'Our text: ' + bits.join(' · ');
  };

  Nego.acceptTheirs = function (st, nego) {
    nego.offer = Object.assign({}, nego.theirOffer);
    nego.status = 'accepted';
    nego.transcript.push({ who: 'you', text: 'We accept your text as tabled.' });
    nego.transcript.push({ who: 'them', text: 'Then we are finished. Signatures in the morning.' });
    return 'accepted';
  };

  /* --------------------------------------------------------- settlement */
  Nego.conclude = function (st, nego) {
    const n = S.dip(st, nego.nationId);
    if (nego.status === 'accepted') {
      nego.issues.forEach((i) => { try { i.apply(st, nego.offer[i.id], n); } catch (e) { /* ignore */ } });
      const yourU = Nego.yourUtility(nego, nego.offer);
      if (n) {
        n.relation += 14 + (yourU < 0.4 ? 8 : 0);
        n.grievance = Math.max(0, (n.grievance || 0) - 20);
        n.cooldown = 6;
      }
      if (yourU > 0.62) { st.national.diplomaticWins++; st.national.prestige += 3; st.society.approval += 2; }
      else if (yourU < 0.38) { st.national.diplomaticLosses++; st.national.concessions++; st.society.approval -= 3; }

      switch (nego.kind) {
        case 'peace': {
          const war = st.wars.find((w) => w.id === nego.ctx.war);
          if (war) S.Mil.endWar(st, war, yourU > 0.6 ? 'victory' : yourU < 0.4 ? 'defeat' : 'settlement');
          break;
        }
        case 'trade': S.Dip.signTreaty(st, nego.nationId, 'trade'); break;
        case 'alliance': S.Dip.signTreaty(st, nego.nationId, 'defense'); break;
        case 'arms': S.Dip.signTreaty(st, nego.nationId, 'arms'); st.world.tension -= 6; break;
        case 'resource': S.Dip.signTreaty(st, nego.nationId, 'energy'); break;
        case 'ultimatum':
          if (yourU > 0.55) { st.national.prestige += 5; st.society.approval += 3; }
          break;
        default: break;
      }
      S.News.push(st, 'nego_success', { nation: n ? n.name : 'a foreign power', kind: nego.kind, severity: 'major' });
      S.game.event('Agreement reached with ' + (n ? n.name : 'the counterparty') + '.', yourU > 0.5 ? 'good' : '');
    } else if (nego.status === 'collapsed' || nego.status === 'walked') {
      if (n) {
        n.relation -= 12; n.grievance = (n.grievance || 0) + 12; n.cooldown = 4;
      }
      st.national.diplomaticLosses++;
      st.world.tension += 4;
      S.News.push(st, 'nego_fail', { nation: n ? n.name : 'a foreign power', severity: 'major' });
      S.game.event('Talks with ' + (n ? n.name : 'the counterparty') + ' collapsed without agreement.', 'bad');
      if (nego.kind === 'ultimatum' && n && n.milPower > st.military.power * 0.9 && st.rng.chance(0.45)) {
        S.Mil.startWar(st, n.id, { aggressor: false, intensity: 65 });
      }
      if (nego.kind === 'peace') {
        const war = st.wars.find((w) => w.id === nego.ctx.war);
        if (war) { war.peaceOffered = false; war.intensity = Math.min(100, war.intensity + 10); }
      }
    }
    st.negotiation = null;
  };

  /* Used when a war ends via a decision rather than the talks screen. */
  Nego.applyTerms = function (st, terms) {
    if (!terms) return;
    if (terms.prestige) st.national.prestige += terms.prestige;
    if (terms.reparations) st.economy.reserves += terms.reparations;
    if (terms.approval) st.society.approval += terms.approval;
  };

})(window.S);

/* STRATEGIAN — the press.
   The same fact is reported differently depending on who owns the paper,
   how free the press is, and how the government is doing.               */
(function (S) {
  'use strict';

  const News = S.News = {};

  /* Which outlets exist and how loud they are, given press freedom. */
  News.activeOutlets = function (st) {
    const pf = st.policy.interior.pressFreedom;
    return S.OUTLETS.filter((o) => {
      if (o.bias === 'dissident') return pf < 45 && st.society.unrest > 22;
      if (o.bias === 'state') return true;
      if (o.bias === 'foreign') return true;
      return pf > 18 || o.bias === 'business';
    });
  };

  News.pickOutlet = function (st, tone) {
    const list = News.activeOutlets(st);
    const pf = st.policy.interior.pressFreedom;
    return st.rng.weighted(list, (o) => {
      let w = 1;
      if (o.bias === 'state') w = 1 + (100 - pf) / 45;
      if (o.bias === 'dissident') w = 0.5;
      if (o.bias === 'foreign') w = 0.7;
      if (tone === 'bad' && o.bias === 'state') w *= 0.35;
      if (tone === 'good' && o.bias === 'dissident') w *= 0.3;
      return w;
    }) || list[0];
  };

  /* ------------------------------------------------------- spin engine */
  // Adjectives and framings applied to a neutral headline by outlet bias.
  News.spin = function (st, outlet, headline, tone) {
    const approve = st.society.approval;
    const leader = st.nation.leaderTitle + ' ' + st.nation.leader;
    if (!headline) return headline;
    switch (outlet.bias) {
      case 'state':
        if (tone === 'bad') return headline.replace(/^/, 'Despite Foreign Interference: ');
        return headline + ' — ' + leader + ' Hailed';
      case 'dissident':
        return headline + ' — And Nobody Will Say Who Decided';
      case 'foreign':
        return headline + ' (' + st.nation.name + ')';
      case 'left':
        if (tone === 'bad') return headline + ' — Working Families Pay Again';
        return headline;
      case 'right':
        if (tone === 'bad') return headline + ' — Weakness Invites More';
        return headline;
      case 'business':
        return headline;
      default:
        if (approve < 35 && tone === 'bad') return headline + ' — Pressure Mounts';
        return headline;
    }
  };

  /* --------------------------------------------------------- templates */
  News.T = {
    war_start: (d) => ['State of War Declared with ' + d.nation, 'Hostilities Begin as Talks Collapse', 'Reservists Called Up; Borders Sealed'],
    war_victory: (d) => ['Victory: ' + d.nation + ' Accepts Our Terms', 'The War Is Over — On Our Terms', 'Troops to Return as Settlement Signed'],
    war_defeat: (d) => ['Terms Accepted After Military Reverses', 'Defeat: Government Signs Under Duress', 'The Line Could Not Be Held'],
    war_peace: (d) => ['Negotiated Settlement Ends the War with ' + d.nation, 'Ceasefire Holds as Text Is Initialled'],
    civil_war: () => ['Civil War: Armed Factions Declare Against the State', 'Provinces in Open Revolt', 'The Army Divides'],
    coup_failed: () => ['Coup Attempt Crushed Before Dawn', 'Officers Arrested; Purge Begins', 'Tanks Withdraw from the Capital'],
    nuclear: (d) => ['NUCLEAR WEAPONS USED', 'Cities Destroyed in Exchange with ' + d.nation, 'The Unthinkable Has Happened'],
    default: () => ['Sovereign Default: State Suspends Debt Payments', 'Creditors Locked Out as Treasury Runs Dry'],
    currency: () => ['The Peg Breaks: Currency Falls Sharply', 'Central Bank Abandons the Defence'],
    sanctions_on_us: (d) => [d.nation + ' Imposes Sanctions', 'Trade Curbs Announced by ' + d.nation],
    treaty: (d) => [d.kind + ' Signed with ' + d.nation, 'Accord Reached with ' + d.nation],
    nego_success: (d) => ['Agreement Reached with ' + d.nation, 'Delegations Sign After Long Talks'],
    nego_fail: (d) => ['Talks with ' + d.nation + ' Collapse', 'Delegations Leave Without Agreement'],
    election_won: (d) => ['Government Returned with ' + d.pct + '%', 'Mandate Renewed at the Ballot Box'],
    election_stolen: () => ['Result Declared; Observers Walk Out', 'Opposition Rejects the Count'],
    foreign_war: (d) => ['War Breaks Out Between ' + d.a + ' and ' + d.b, d.a + ' and ' + d.b + ' Exchange Fire'],
    inflation_high: (d) => ['Inflation Reaches ' + d.v + '%', 'Prices Climb Again as Wages Lag', 'Cost of Living Dominates Politics'],
    inflation_ok: (d) => ['Inflation Falls to ' + d.v + '%', 'Price Pressures Ease'],
    unemployment_high: (d) => ['Unemployment Hits ' + d.v + '%', 'Job Losses Spread Beyond Industry'],
    unemployment_low: (d) => ['Unemployment Down to ' + d.v + '%', 'Labour Market Tightens'],
    market_crash: (d) => ['Markets Fall ' + d.v + '% in Session', 'Sell-Off Wipes Out Months of Gains'],
    market_rally: (d) => ['Markets Rally to New Highs', 'Investors Return as Confidence Improves'],
    growth_recession: () => ['Economy Enters Recession', 'Second Quarter of Contraction Confirmed'],
    growth_boom: (d) => ['Economy Grows ' + d.v + '%', 'Growth Beats Every Forecast'],
    unrest_high: () => ['Mass Protests in Major Cities', 'Demonstrations Enter a Second Week', 'Police Clash with Crowds'],
    unrest_calm: () => ['Streets Quiet as Talks Begin', 'Protest Movement Loses Momentum'],
    approval_low: (d) => ['Approval Falls to ' + d.v + '%', 'Government Popularity at Record Low'],
    approval_high: (d) => ['Approval Climbs to ' + d.v + '%', 'Public Mood Turns'],
    corruption: () => ['Corruption Scandal Reaches the Ministries', 'Officials Arrested in Procurement Inquiry'],
    oil_spike: (d) => ['Oil Price Jumps to ' + d.v, 'Energy Costs Surge Worldwide'],
    oil_fall: (d) => ['Oil Slides to ' + d.v, 'Energy Prices Retreat'],
    culture: () => ['Our Films Sweep the International Awards', 'Foreign Enrolment at Our Universities Hits a Record',
      'Global Audiences Adopt Our Music', 'Our Language Overtakes Rivals in Schools Abroad'],
    tech: () => ['National Laboratories Announce a Breakthrough', 'Patent Filings Reach a Record'],
    ambient_good: () => ['Infrastructure Programme Opens Ahead of Schedule', 'Hospital Waiting Times Fall',
      'Exports Reach a Record', 'School Results Improve for a Third Year', 'Crime Falls to a Ten-Year Low'],
    ambient_bad: () => ['Power Cuts Hit Second City for Third Night', 'Hospital Backlogs Grow',

    ambient_neutral: () => ['Census Returns Published', 'Central Bank Minutes Reveal a Split',

  };

  News.push = function (st, key, data) {

    if (typeof tmpl === 'function') base = st.rng.pick(tmpl(data));
    else base = data.text || 'Government Announcement';
    const tone = data.tone || (['war_defeat', 'civil_war', 'nuclear', 'default', 'currency', 'sanctions_on_us',
      'nego_fail', 'inflation_high', 'unemployment_high', 'market_crash', 'growth_recession',
      'unrest_high', 'approval_low', 'corruption', 'ambient_bad', 'election_stolen', 'war_start']
      .indexOf(key) >= 0 ? 'bad' : ['war_victory', 'treaty', 'nego_success', 'election_won', 'inflation_ok',
        'unemployment_low', 'market_rally', 'growth_boom', 'unrest_calm', 'approval_high', 'culture',
        'tech', 'ambient_good', 'war_peace'].indexOf(key) >= 0 ? 'good' : '');

    const outlet = News.pickOutlet(st, tone);
    const headline = News.spin(st, outlet, base, tone);
    const item = {
      id: S.uid('hl'),
      outlet: outlet.name, outletColor: outlet.color, bias: outlet.bias,
      text: headline, sub: data.sub || '', tone: tone,
      severity: data.severity || 'normal',
      date: S.dateLabel(st.date), day: S.absDay(st.date)
    };
    st.headlines.unshift(item);
    if (st.headlines.length > 260) st.headlines.length = 260;
    if (S.UI && S.UI.onNews) S.UI.onNews(item);
    return item;
  };

  /* Free-form headline used by decision outcomes. */
  News.custom = function (st, text, tone, sub) {
    const outlet = News.pickOutlet(st, tone);
    const item = {
      id: S.uid('hl'), outlet: outlet.name, outletColor: outlet.color, bias: outlet.bias,
      text: News.spin(st, outlet, text, tone), sub: sub || '', tone: tone || '',

    };

  /* ------------------------------------------------- threshold watcher */
  News.watch = function (st) {

    const check = (key, value, band, fn) => {

    check('inflation', S.round(e.inflation, 1), 2.6, (v, p) => {

    });
    check('unemployment', S.round(e.unemployment, 1), 1.6, (v, p) => {
      News.push(st, v > p ? 'unemployment_high' : 'unemployment_low', { v: S.round(v, 1) });
    });
    check('approval', S.round(st.society.approval, 0), 10, (v, p) => {
      News.push(st, v < p ? 'approval_low' : 'approval_high', { v: S.round(v, 0) });
    });
    check('market', S.round(e.marketIndex, 0), Math.max(12, e.marketIndex * 0.11), (v, p) => {
      News.push(st, v < p ? 'market_crash' : 'market_rally', { v: S.round(Math.abs((v - p) / p) * 100, 1) });
    });
    check('oil', S.round(st.world.oil, 0), 22, (v, p) => {
      News.push(st, v > p ? 'oil_spike' : 'oil_fall', { v: S.round(v, 0) });
    });
    check('unrest', S.round(st.society.unrest, 0), 14, (v, p) => {
      News.push(st, v > p ? 'unrest_high' : 'unrest_calm', {});
    });
    if (e.growth < -0.4 && !w.recession) { w.recession = true; News.push(st, 'growth_recession', {}); }
    if (e.growth > 1.0 && w.recession) { w.recession = false; }
    if (e.growth > 5.5 && !w.boom) { w.boom = true; News.push(st, 'growth_boom', { v: S.round(e.growth, 1) }); }
    if (e.growth < 4 && w.boom) w.boom = false;
  };

  /* Ambient colour: the ordinary business of a country. */
  News.ambient = function (st) {
    const good = st.society.approval * 0.4 + st.quality.infra * 0.3 + st.quality.health * 0.3;
    const roll = st.rng();
    // The press keeps returning to a wound the country is still carrying.
    if (roll < 0.22 && S.Aftermath.recall(st)) return null;
    if (st.national.softPower > 62 && roll < 0.14) return News.push(st, 'culture', {});
    if (st.quality.science > 68 && roll < 0.20) return News.push(st, 'tech', {});
    if (st.society.corruption > 58 && roll < 0.28) return News.push(st, 'corruption', {});
    if (roll < 0.30 + (good - 50) / 200) return News.push(st, 'ambient_good', {});
    if (roll < 0.62 - (good - 50) / 200) return News.push(st, 'ambient_bad', {});
    return News.push(st, 'ambient_neutral', {});
  };

})(window.S);
