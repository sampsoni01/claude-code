name: Isoline builds

on:
  push:
    branches: [claude/fantasy-map-design-h4jk93]
    paths: ["isoline/**", ".github/workflows/isoline-build.yml"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            exe: isoline.exe
            archive: isoline-windows.zip
          - name: macOS
            os: macos-latest
            exe: isoline
            archive: isoline-macos.zip
          - name: Linux
            os: ubuntu-latest
            exe: isoline
            archive: isoline-linux.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isoline
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Build
        working-directory: isoline
        run: cargo build --release -p isoline
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/isoline
          cp isoline/target/release/${{ matrix.exe }} dist/isoline/
          cp -r isoline/assets dist/isoline/assets
          cp isoline/README.md dist/isoline/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.archive }} isoline
          else
            zip -r ../${{ matrix.archive }} isoline
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  web:
    name: Browser build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isoline
          key: wasm
      - name: Install wasm-bindgen (the version Cargo.lock pins)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"' isoline/Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "wasm-bindgen $V"
          curl -sSL -o wb.tar.gz "https://github.com/rustwasm/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wb.tar.gz
          echo "WASM_BINDGEN=$PWD/wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Install wasm-opt
        run: |
          curl -sSL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - name: Build
        run: isoline/web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: isoline-web
          path: isoline/web/dist
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: isoline/web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Isoline web build from ${{ github.sha }}"

  release:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          Desktop builds of the Isoline fantasy map maker.

          The browser version runs at https://sampsoni01.github.io/claude-code/ (Chrome, Edge, Firefox or Safari with WebGPU). Nothing to install.

          Desktop: download the zip for your system, unzip it, and run the `isoline` program inside.

          If it crashes or refuses to start, it shows the reason in a dialog and writes `isoline-crash.log` and `isoline.log` next to the program (or in `%LOCALAPPDATA%\isoline` when that folder is read-only). Send those files when reporting a problem.

          The program is not code-signed. Windows shows a blue "Windows protected your PC" box: click More info, then Run anyway. macOS says it cannot verify the developer: right-click the program, choose Open, then Open again.
          NOTES
      - name: Publish or refresh the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Remove every earlier release with this tag, drafts included, and the tag itself.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == "isoline-latest") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/isoline-latest" || true
          gh release create isoline-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Isoline map maker (latest build)" \
            --notes-file notes.md
          for f in dist/*.zip; do
            timeout 300 gh release upload isoline-latest "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done
          gh release view isoline-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
