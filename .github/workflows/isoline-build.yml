name: Isoline builds

on:
  push:
    branches: [claude/fantasy-map-design-h4jk93]
    paths: ["isoline/**", ".github/workflows/isoline-build.yml"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            exe: isoline.exe
            archive: isoline-windows.zip
          - name: macOS
            os: macos-latest
            exe: isoline
            archive: isoline-macos.zip
          - name: Linux
            os: ubuntu-latest
            exe: isoline
            archive: isoline-linux.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isoline
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Build
        working-directory: isoline
        run: cargo build --release -p isoline
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/isoline
          cp isoline/target/release/${{ matrix.exe }} dist/isoline/
          cp -r isoline/assets dist/isoline/assets
          cp isoline/README.md dist/isoline/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.archive }} isoline
          else
            zip -r ../${{ matrix.archive }} isoline
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish or refresh the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete isoline-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create isoline-latest dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Isoline map maker (latest build)" \
            --notes "Desktop builds of the Isoline fantasy map maker.

          Download the zip for your system, unzip it, and run the \`isoline\` program inside. Keep the \`assets\` folder next to it.

          The program is not code-signed. Windows shows a blue \"Windows protected your PC\" box: click More info, then Run anyway. macOS says it cannot verify the developer: right-click the program, choose Open, then Open again."
