[workspace]
resolver = "2"
members = ["crates/isoline-core", "crates/isoline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
isoline-core = { path = "crates/isoline-core" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "29"
winit = "0.30"
egui = "0.35"
egui-wgpu = { version = "0.35", features = ["winit"] }
egui-winit = "0.35"
pollster = "0.4"
rfd = "0.15"
notify = "8"
half = "2"
zip = "2"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
dirs = "6"
walkdir = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
